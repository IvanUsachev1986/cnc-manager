<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-zinc-800 p-4 rounded-xl border border-zinc-700 shadow-lg; }
            .card-hover { @apply bg-zinc-800 p-5 rounded-xl border border-zinc-700 shadow-lg flex justify-between items-center cursor-pointer active:scale-95 transition-transform hover:bg-zinc-700; }
            .input-field { @apply w-full bg-zinc-900 border border-zinc-700 p-3 rounded-lg text-sm text-white outline-none focus:border-blue-500 shadow-inner; }
            .input-sm { @apply bg-zinc-900 border border-zinc-700 p-2 rounded-lg text-sm text-white focus:border-blue-500 outline-none shadow-inner; }
            .btn-primary { @apply w-full bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white font-bold p-4 rounded-xl shadow-lg active:scale-95 transition-transform; }
            .btn-blue { @apply bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center; }
            .btn-icon { @apply text-zinc-400 hover:text-white bg-zinc-900 p-2 rounded-lg border border-zinc-700 active:scale-95 transition-colors flex items-center justify-center; }
            .label-text { @apply block text-[12px] text-zinc-400 mb-1 font-bold; }
            .nav-item { @apply flex flex-1 flex-col items-center justify-center p-2 rounded-lg transition-colors text-[12px] font-medium tracking-wide; }
            .text-title { @apply text-3xl font-bold text-white hover:text-blue-400 transition-colors tracking-widest outline-none active:scale-95; }
        }
    </style>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .progress-bar { transition: width 0.5s ease-in-out, background-color 0.5s ease; }
        .text-shadow-sm { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
    </style>
</head>

<body class="bg-zinc-900 text-zinc-200 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script>
        Babel.registerPreset('react-classic', {
            presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
        });
    </script>
    
    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useMemo } = React;

        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyDt7SZC0XiStcwXnTZNsyRRiXOhB30gjt0",
                authDomain: "cnc-manager-a6a06.firebaseapp.com",
                projectId: "cnc-manager-a6a06",
                storageBucket: "cnc-manager-a6a06.firebasestorage.app",
                messagingSenderId: "113877473214",
                appId: "1:113877473214:web:846ac76f7a11377d918bef"
            };
        } catch (e) {
            console.error("Firebase config parsing error", e);
            firebaseConfig = {};
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cnc-manager-a6a06';

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const getDbRef = (colName) => db.collection('artifacts').doc(appId).collection('public').doc('data').collection(colName);

        const pushAppHistory = () => { window.history.pushState({ modal: true }, ''); };

        const Icons = {
            Dashboard: () => <svg className="w-7 h-7 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 3v18h18M9 17v-6M15 17V9M21 17V5" /></svg>,
            Projects: () => <svg className="w-7 h-7 mb-1" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2L2 7l10 5 10-5-10-5z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2 17l10 5 10-5M2 12l10 5 10-5" /></svg>,
            Service: () => <svg className="w-7 h-7 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="2" strokeWidth="2" /><circle cx="12" cy="12" r="7" strokeWidth="4.5" strokeDasharray="3.5 2" strokeDashoffset="0.8" /></svg>,
            Warehouse: () => <svg className="w-7 h-7 mb-1" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 7v10l10 5M22 7v10l-10 5M12 12v10" /></svg>,
            GoogleDrive: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" /><path strokeLinecap="round" strokeLinejoin="round" d="M8 12h4M8 16h8" /></svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Check: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12" /></svg>,
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Minus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ArrowLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
            Trash: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>,
            Upload: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            ChevronRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        };

        const getProgressColor = (percent) => {
            if (percent === 0) return 'bg-red-500';
            if (percent < 50) return 'bg-orange-500';
            if (percent < 100) return 'bg-yellow-400';
            return 'bg-green-500';
        };

        const getBorderColor = (percent) => {
            if (percent === 0) return 'border-red-500';
            if (percent < 50) return 'border-orange-500';
            if (percent < 100) return 'border-yellow-400';
            return 'border-green-500';
        };

        const DrillDownCard = ({ title, onClick }) => (
            <div onClick={onClick} className="card-hover">
                <div className="font-bold text-white text-xl">{title}</div>
                <div className="text-zinc-500"><Icons.ChevronRight /></div>
            </div>
        );

        // Хелпер для красивого отображения названия станка без цифр
        const displayMachine = (mName) => mName.replace(/^\d\.\s*/, '');

        // --- ДАШБОРД (АНАЛИТИКА + НАСТРОЙКИ) ---
        const DashboardView = ({ projects, warehouse, tools, toolLogs, user, onLogout, goToProjects, goToService, goToWarehouse }) => {
            const totalProjectsCount = projects.length;
            const activeProjectsCount = projects.filter(p => !p.finishDate).length;
            const finishedProjectsCount = projects.filter(p => p.finishDate).length;
            
            const latestKatzKnife = toolLogs.find(l => (l.type || 'knives') === 'knives' && l.machine === "1. KATZ CNC");
            const latestHolcerKnife = toolLogs.find(l => (l.type || 'knives') === 'knives' && l.machine === "2. Holcer CNC");
            const latestKatzFilter = toolLogs.find(l => l.type === 'filters' && l.machine === "1. KATZ CNC");
            const latestHolcerFilter = toolLogs.find(l => l.type === 'filters' && l.machine === "2. Holcer CNC");

            const totalToolsQty = tools.reduce((sum, t) => sum + (Number(t.quantity) || 0), 0);
            const totalMatsQty = warehouse.reduce((sum, m) => sum + (Number(m.quantity) || 0), 0);

            return (
                <div className="p-4 pb-24 space-y-6">
                    <div className="flex justify-center mb-6 mt-2">
                        <h1 className="text-3xl font-bold text-white tracking-widest text-center">Аналитика</h1>
                    </div>

                    {/* БЛОК ПРОЕКТЫ */}
                    <div className="card border-zinc-700/50">
                        <h3 className="text-xl font-bold text-white text-center mb-4 tracking-wide">Проекты</h3>
                        <div className="grid grid-cols-3 gap-2">
                            <div onClick={() => goToProjects('all')} className="bg-blue-900/20 border border-blue-800/50 hover:border-blue-500/50 cursor-pointer rounded-xl flex flex-col items-center justify-center py-4 active:scale-95 transition-all">
                                <div className="text-2xl font-bold text-blue-400 mb-1">{totalProjectsCount}</div>
                                <div className="text-[12px] text-blue-400 font-bold text-center">Всего</div>
                            </div>
                            <div onClick={() => goToProjects('active')} className="bg-orange-900/20 border border-orange-800/50 hover:border-orange-500/50 cursor-pointer rounded-xl flex flex-col items-center justify-center py-4 active:scale-95 transition-all">
                                <div className="text-2xl font-bold text-orange-400 mb-1">{activeProjectsCount}</div>
                                <div className="text-[12px] text-orange-400 font-bold text-center">В работе</div>
                            </div>
                            <div onClick={() => goToProjects('finished')} className="bg-green-900/20 border border-green-800/50 hover:border-green-500/50 cursor-pointer rounded-xl flex flex-col items-center justify-center py-4 active:scale-95 transition-all">
                                <div className="text-2xl font-bold text-green-400 mb-1">{finishedProjectsCount}</div>
                                <div className="text-[12px] text-green-400 font-bold text-center">Завершено</div>
                            </div>
                        </div>
                    </div>

                    {/* БЛОК СЕРВИС (ОБЪЕДИНЕННЫЙ) */}
                    <div className="card border-zinc-700/50">
                        <h3 className="text-xl font-bold text-white text-center mb-5 tracking-wide">Сервис</h3>
                        
                        {/* Подкатегория: Замена ножей */}
                        <div className="mb-6">
                            <h4 className="text-sm font-bold text-zinc-400 text-center mb-3">Замена ножей</h4>
                            <div className="grid grid-cols-2 gap-3">
                                <div onClick={() => goToService('knives', '1. KATZ CNC')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-3 active:scale-95 transition-all flex flex-col items-center text-center">
                                    <div className="text-sm text-white font-bold mb-1">KATZ CNC</div>
                                    <div className="text-xs text-white mb-2">{latestKatzKnife ? latestKatzKnife.date : 'Нет данных'}</div>
                                    <div className="text-xs text-zinc-300 font-medium truncate w-full bg-zinc-800 p-1.5 rounded-lg border border-zinc-700/50">{latestKatzKnife ? latestKatzKnife.toolName : '-'}</div>
                                </div>
                                <div onClick={() => goToService('knives', '2. Holcer CNC')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-3 active:scale-95 transition-all flex flex-col items-center text-center">
                                    <div className="text-sm text-white font-bold mb-1">Holcer CNC</div>
                                    <div className="text-xs text-white mb-2">{latestHolcerKnife ? latestHolcerKnife.date : 'Нет данных'}</div>
                                    <div className="text-xs text-zinc-300 font-medium truncate w-full bg-zinc-800 p-1.5 rounded-lg border border-zinc-700/50">{latestHolcerKnife ? latestHolcerKnife.toolName : '-'}</div>
                                </div>
                            </div>
                        </div>

                        {/* Подкатегория: Очистка фильтров */}
                        <div>
                            <h4 className="text-sm font-bold text-zinc-400 text-center mb-3">Очистка фильтров</h4>
                            <div className="grid grid-cols-2 gap-3">
                                <div onClick={() => goToService('filters', '1. KATZ CNC')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-3 active:scale-95 transition-all flex flex-col items-center text-center">
                                    <div className="text-sm text-white font-bold mb-2">KATZ CNC</div>
                                    <div className="text-xs text-white bg-zinc-800 p-1.5 rounded-lg border border-zinc-700/50 w-full">{latestKatzFilter ? latestKatzFilter.date : 'Нет данных'}</div>
                                </div>
                                <div onClick={() => goToService('filters', '2. Holcer CNC')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-3 active:scale-95 transition-all flex flex-col items-center text-center">
                                    <div className="text-sm text-white font-bold mb-2">Holcer CNC</div>
                                    <div className="text-xs text-white bg-zinc-800 p-1.5 rounded-lg border border-zinc-700/50 w-full">{latestHolcerFilter ? latestHolcerFilter.date : 'Нет данных'}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* БЛОК СКЛАД */}
                    <div className="card border-zinc-700/50">
                        <h3 className="text-xl font-bold text-white text-center mb-4 tracking-wide">Склад</h3>
                        <div className="grid grid-cols-2 gap-3">
                            <div onClick={() => goToWarehouse('tools')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-4 flex flex-col items-center justify-center active:scale-95 transition-all">
                                <div className="text-3xl font-bold text-zinc-200 mb-1">{totalToolsQty} <span className="text-sm text-zinc-500">шт</span></div>
                                <div className="text-[12px] text-zinc-400 font-bold text-center">Всего фрез</div>
                            </div>
                            <div onClick={() => goToWarehouse('materials')} className="bg-zinc-900 border border-zinc-700 hover:border-zinc-500 cursor-pointer rounded-xl p-4 flex flex-col items-center justify-center active:scale-95 transition-all">
                                <div className="text-3xl font-bold text-zinc-200 mb-1">{totalMatsQty} <span className="text-sm text-zinc-500">шт</span></div>
                                <div className="text-[12px] text-zinc-400 font-bold text-center">Всего материалов</div>
                            </div>
                        </div>
                    </div>

                    {/* НАСТРОЙКИ */}
                    <div className="card border-zinc-700/50 mt-8">
                        <h3 className="text-xl font-bold text-white text-center mb-4 tracking-wide">Аккаунт и настройки</h3>
                        <div className="flex items-center space-x-4 mb-6">
                            <div className="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center font-bold text-xl shadow-lg text-white">
                                {user.email ? user.email[0].toUpperCase() : 'U'}
                            </div>
                            <div className="text-white text-lg font-medium truncate">{user.email}</div>
                        </div>
                        <button onClick={onLogout} className="w-full bg-red-500/10 text-red-500 border border-red-500/50 hover:bg-red-500/20 font-bold p-3 rounded-xl active:scale-95 transition-all">
                            Выйти из аккаунта
                        </button>
                    </div>
                </div>
            );
        };

        const UnifiedWarehouseView = ({ warehouse, tools, onAdd, onUpdateQty, onDelete, onBulkImport, subTab, setSubTab }) => {
            const [bulkMode, setBulkMode] = useState(false);
            const [bulkText, setBulkText] = useState('');
            const [showForm, setShowForm] = useState(false);
            const [qty, setQty] = useState('');
            const [mName, setMName] = useState('');
            const [mThick, setMThick] = useState('');
            const [mColor, setMColor] = useState('');
            const [mSize, setMSize] = useState('');
            const [tName, setTName] = useState('');
            const [tSize, setTSize] = useState('');

            if (!subTab) {
                return (
                    <div className="p-4 pb-24">
                        <div className="flex justify-center mb-8 mt-2">
                            <h1 className="text-3xl font-bold text-white tracking-widest text-center">Склад</h1>
                        </div>
                        <div className="space-y-4">
                            <DrillDownCard title="Материалы" onClick={() => { pushAppHistory(); setSubTab('materials'); }} />
                            <DrillDownCard title="Фрезы" onClick={() => { pushAppHistory(); setSubTab('tools'); }} />
                        </div>
                    </div>
                );
            }

            const currentCollection = subTab === 'materials' ? 'warehouse' : 'tools';
            const currentItems = subTab === 'materials' ? warehouse : tools;
            const title = subTab === 'materials' ? 'Материалы' : 'Фрезы';

            const handleAddMaterial = () => {
                if (!mName) return;
                const fullName = `${mName} ${mThick} ${mColor} ${mSize}`.trim().replace(/\s+/g, ' ');
                onAdd({ name: fullName, quantity: Number(qty) || 0, details: { mName, mThick, mColor, mSize } }, currentCollection);
                setMName(''); setMThick(''); setMColor(''); setMSize(''); setQty('');
                setShowForm(false);
            };

            const handleAddTool = () => {
                if (!tName) return;
                const fullName = tSize ? `${tName} ${tSize}`.trim() : tName;
                onAdd({ name: fullName, quantity: Number(qty) || 0, details: { tName, tSize } }, currentCollection);
                setTName(''); setTSize(''); setQty('');
                setShowForm(false);
            };

            const handleBulkSubmit = () => {
                onBulkImport(bulkText, currentCollection);
                setBulkText(''); setBulkMode(false);
            };

            return (
                <div className="p-4 pb-24">
                    {/* КНОПКА ВО ВТОРОМ РЯДУ БЕЗ СТРЕЛОЧЕК */}
                    <div className="flex flex-col items-center mb-6 mt-2">
                        <h1 className="text-3xl font-bold text-white tracking-widest mb-5">{title}</h1>
                        <button onClick={() => setShowForm(!showForm)} className="btn-blue w-full flex justify-center items-center gap-2">
                            <Icons.Plus /> <span>Добавить {subTab === 'materials' ? 'материал' : 'фрезу'}</span>
                        </button>
                    </div>

                    <div className="flex space-x-2 mb-4">
                        <button onClick={() => { setBulkMode(!bulkMode); setShowForm(false); }} className="flex-1 text-[11px] font-bold text-blue-400 bg-zinc-800 border border-zinc-700 py-3 rounded-lg flex items-center justify-center space-x-2 hover:bg-zinc-700 active:scale-95 transition-all">
                            <Icons.Upload /> <span>Загрузить списком</span>
                        </button>
                    </div>

                    {bulkMode && (
                        <div className="card mb-6 border-zinc-700">
                            <p className="label-text">Вставьте столбец с названиями из Excel:</p>
                            <textarea className="input-field h-32 mb-3" placeholder={"ДСП 16мм\nМДФ 22мм..."} value={bulkText} onChange={e => setBulkText(e.target.value)} />
                            <button onClick={handleBulkSubmit} className="btn-blue w-full">Импортировать</button>
                        </div>
                    )}

                    {showForm && !bulkMode && (
                        <div className="card mb-6 border-zinc-700">
                            <h3 className="text-sm font-bold text-white mb-3 flex justify-between items-center">
                                Ввод данных
                                <button onClick={() => setShowForm(false)} className="text-zinc-500 hover:text-white"><Icons.Minus /></button>
                            </h3>
                            {subTab === 'materials' ? (
                                <div className="space-y-3">
                                    <input className="input-sm w-full" placeholder="Название (напр. ДСП)" value={mName} onChange={e => setMName(e.target.value)} />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input className="input-sm w-full" placeholder="Толщина (16mm)" value={mThick} onChange={e => setMThick(e.target.value)} />
                                        <input className="input-sm w-full" placeholder="Цвет" value={mColor} onChange={e => setMColor(e.target.value)} />
                                    </div>
                                    <div className="grid grid-cols-[1fr_80px] gap-2">
                                        <input className="input-sm w-full" placeholder="Размер (1200*2440)" value={mSize} onChange={e => setMSize(e.target.value)} />
                                        <input type="number" className="input-sm w-full text-center" placeholder="Шт." value={qty} onChange={e => setQty(e.target.value)} />
                                    </div>
                                    <button onClick={handleAddMaterial} className="btn-blue w-full">Добавить материал</button>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="flex space-x-2">
                                        <input className="input-sm flex-1" placeholder="Название/Номер (напр. Фреза прямая)" value={tName} onChange={e => setTName(e.target.value)} />
                                        <input className="input-sm w-1/3" placeholder="Размер (6*24)" value={tSize} onChange={e => setTSize(e.target.value)} />
                                    </div>
                                    <input type="number" className="input-sm w-full text-center" placeholder="Количество (Шт.)" value={qty} onChange={e => setQty(e.target.value)} />

            const submitNewLog = () => {

                    <div className="p-4 pb-24">

            return (
                <div className="p-4 pb-24">
                    {/* КНОПКА ВО ВТОРОМ РЯДУ БЕЗ СТРЕЛОЧЕК */}
                    <div className="flex flex-col items-center mb-6 mt-2">
                        <h1 className="text-3xl font-bold text-blue-400 tracking-widest mb-5">{displayMachine(activeMachine)}</h1>
                        <button onClick={() => setIsCreatingLog(true)} className="btn-blue w-full flex justify-center items-center gap-2">

                    </div>

                    {editingLogId && (

        const ProjectFormView = ({ projectToEdit, onSave, onCancel, onDelete, warehouse }) => {
            const [customer, setCustomer] = useState(projectToEdit ? (projectToEdit.customer || '') : '');
            const [name, setName] = useState(projectToEdit ? projectToEdit.name : '');
            const [notes, setNotes] = useState(projectToEdit ? (projectToEdit.notes || '') : '');
            const [startDate, setStartDate] = useState(projectToEdit ? projectToEdit.startDate : new Date().toLocaleDateString('ru-RU'));
            const [endDate, setEndDate] = useState(projectToEdit ? (projectToEdit.endDate || projectToEdit.finishDate || '') : '');
            const [driveLink, setDriveLink] = useState(projectToEdit ? (projectToEdit.driveLink || '') : '');
            const [mats, setMats] = useState(projectToEdit && projectToEdit.materials && projectToEdit.materials.length > 0
                ? projectToEdit.materials
                : [{ id: Date.now(), name: '', total: 1, done: 0 }]);

            const [isImportMode, setIsImportMode] = useState(false);
            const [importText, setImportText] = useState("");

            const addRow = () => setMats([...mats, { id: Date.now(), name: '', total: 1, done: 0 }]);
            const upd = (id, f, v) => setMats(mats.map(m => m.id === id ? { ...m, [f]: v } : m));
            const rm = (id) => setMats(mats.filter(m => m.id !== id));

            const handleParseImport = () => {
                if (!importText.trim()) { setIsImportMode(false); return; }
                let linesRaw = importText.replace(/\r\n/g, '\n').split('\n');
                let parsedMats = [];
                let currentNameBuffer = [];
                let expectingData = false;

                for (let i = 0; i < linesRaw.length; i++) {
                    let line = linesRaw[i].trim();
                    if (!line) continue;
                    let cleanLine = line.replace(/"/g, '').trim();
                    cleanLine = cleanLine.replace(/has grain.*$/i, '').trim();
                    cleanLine = cleanLine.replace(/₪\s*[\d,.]+/g, '').replace(/₪\s*#+/g, '').replace(/₪/g, '').trim();
                    if (!cleanLine) continue;

                    const lower = cleanLine.toLowerCase();
                    if (lower.includes('material summary') || lower.includes('job:') || lower.includes('description') || /^page \d/.test(lower)) continue;
                    if (/^\d{2}\/\d{2}\/\d{4}/.test(cleanLine)) continue;
                    if (/^(qty|width|length|thick|cost|\s|,)*$/i.test(cleanLine)) continue;
                    if (/^qty\s+width/i.test(cleanLine)) continue;

                    const dataMatch = cleanLine.match(/^(\d+)\s*(?:mm\s*)?([\d,.]+)(?:\s*mm)?\s+(?:x\s*|\*\s*)?([\d,.]+)(?:\s*mm)?/i);
                    if (dataMatch) {
                        let qty = parseInt(dataMatch[1], 10);
                        let width = dataMatch[2].replace(/,/g, '').split('.')[0];
                        let length = dataMatch[3].replace(/,/g, '').split('.')[0];
                        let fullName = currentNameBuffer.join(' ').trim();
                        if (fullName) {
                            let finalName = `${fullName} (${width}x${length})`;
                            parsedMats.push({ name: finalName, total: qty, done: 0 });
                        }
                        expectingData = true;
                        continue;
                    }

                    if (expectingData) {
                        currentNameBuffer = [cleanLine];
                        expectingData = false;
                    } else {
                        currentNameBuffer.push(cleanLine);
                    }
                }

                if (parsedMats.length === 0) {
                    linesRaw.forEach(line => {
                        let cleanLine = line.replace(/"/g, '').trim();
                        if (!cleanLine) return;
                        let m = cleanLine.match(/^(.*?)\s+(\d+)\s*(?:шт\.?|pcs\.?)?$/i);
                        if (m && m[1].length > 2) {
                            parsedMats.push({ name: m[1].trim(), total: parseInt(m[2]), done: 0 });
                        } else {
                            parsedMats.push({ name: cleanLine, total: 1, done: 0 });
                        }
                    });
                }

                const grouped = [];
                parsedMats.forEach(pm => {
                    let clean = pm.name.replace(/\s+/g, ' ').replace(/^:\s*/, '').trim();
                    const existing = grouped.find(g => g.name === clean);
                    if (existing) { existing.total += pm.total; } 
                    else if (clean) { grouped.push({ id: Date.now() + Math.random(), name: clean, total: pm.total, done: 0 }); }
                });

                if (grouped.length > 0) {
                    if (mats.length === 1 && !mats[0].name) { setMats(grouped); } 
                    else { setMats([...mats, ...grouped]); }
                    setImportText(''); setIsImportMode(false);
                } else {
                    alert("Не удалось распознать материалы.");
                }
            };

            return (
                <div className="p-4 pb-24">
                    <div className="flex justify-between items-center mb-6 mt-2">
                        <button onClick={onCancel} className="mr-3 text-zinc-400 hover:text-white p-2 -ml-2 rounded-lg transition-colors"><Icons.ArrowLeft /></button>
                        <h1 className="text-2xl font-bold text-white tracking-widest outline-none truncate">
                            {projectToEdit ? "Редактировать" : "Новый проект"}
                        </h1>
                        <div className="w-8"></div>
                    </div>

                    <div className="space-y-4 mb-8">
                        <div>
                            <label className="label-text">Заказчик (Клиент):</label>
                            <input className="input-field" placeholder="Имя заказчика или номер договора" value={customer} onChange={e => setCustomer(e.target.value)} />
                        </div>
                        <div>
                            <label className="label-text">Название проекта:</label>
                            <input className="input-field" placeholder="Например: Кухня 1" value={name} onChange={e => setName(e.target.value)} />
                        </div>
                        <div>
                            <label className="label-text">Даты проекта:</label>
                            <div className="flex space-x-2">
                                <input className="input-field flex-1" placeholder="Начало (ДД.ММ.ГГГГ)" value={startDate} onChange={e => setStartDate(e.target.value)} />
                                <input className="input-field flex-1" placeholder="Окончание (План)" value={endDate} onChange={e => setEndDate(e.target.value)} />
                            </div>
                        </div>
                        <div>
                            <label className="label-text">Ссылка на Google Drive (Чертежи):</label>
                            <input className="input-field" placeholder="https://drive.google.com/..." value={driveLink} onChange={e => setDriveLink(e.target.value)} />
                        </div>
                        
                        <div>
                            <label className="label-text">Заметки по проекту:</label>
                            <textarea className="input-field min-h-[80px]" placeholder="Опишите изменения, брак, или важные детали..." value={notes} onChange={e => setNotes(e.target.value)} />
                        </div>

                        <div className="card mt-6 relative">
                            <div className="flex justify-between items-center mb-4">
                                <label className="label-text !mb-0">План резки (Материалы)</label>
                                {!isImportMode && (
                                    <button onClick={() => setIsImportMode(true)} className="text-[12px] font-bold bg-blue-600/20 text-blue-400 px-3 py-1.5 rounded-lg hover:bg-blue-600/40 transition-colors">
                                        ⚡ Быстрый импорт
                                    </button>
                                )}
                            </div>
                            {isImportMode ? (
                                <div className="mb-4 bg-zinc-900 p-3 rounded-xl border border-zinc-700/50">
                                    <div className="text-xs text-zinc-400 mb-2">Вставьте скопированный текст из PDF...</div>
                                    <textarea className="input-field h-32 mb-3 text-xs font-mono leading-tight" value={importText} onChange={e => setImportText(e.target.value)} />
                                    <div className="flex space-x-2">
                                        <button onClick={() => setIsImportMode(false)} className="flex-1 bg-zinc-700 text-white font-bold p-2 rounded-lg text-sm">Отмена</button>
                                        <button onClick={handleParseImport} className="flex-1 bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">Распознать</button>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    {mats.map(m => (
                                        <div key={m.id} className="flex space-x-2 mb-3 items-center">
                                            <input list="warehouse-suggestions" className="input-sm flex-1" placeholder="Материал" value={m.name} onChange={e => upd(m.id, 'name', e.target.value)} />
                                            <input type="number" min="1" className="input-sm w-16 text-center" value={m.total} onChange={e => upd(m.id, 'total', e.target.value)} />
                                            <button onClick={() => rm(m.id)} className="btn-icon !p-2 hover:!text-red-400"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                    <button onClick={addRow} className="text-sm text-blue-400 font-medium mt-3 flex items-center p-2 -ml-2 rounded-lg hover:bg-zinc-700 transition-colors"><Icons.Plus /> Добавить вручную</button>
                                </>
                            )}
                        </div>
                        <div className="flex justify-center mb-6 mt-6">
                            <button onClick={() => onSave(customer, name, mats, projectToEdit ? projectToEdit.id : null, startDate, endDate, driveLink, notes)} disabled={!name.trim()} className="btn-primary">
                                {projectToEdit ? "Сохранить изменения" : "Создать проект"}
                            </button>
                        </div>
                        {projectToEdit && (
                            <div>
                                <button onClick={() => onDelete(projectToEdit.id)} className="bg-red-600 w-full text-white font-bold p-3 mt-2 rounded-xl shadow-lg active:scale-95 transition-transform">Удалить проект</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LoginView = ({ onLogin, error }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                onLogin(email, password).finally(() => setLoading(false));
            };

            return (
                <div className="min-h-screen bg-zinc-900 flex flex-col items-center justify-center p-4">
                    <div className="card w-full max-w-sm border-zinc-700/50 shadow-2xl">
                        <h2 className="text-2xl font-bold text-white mb-8 text-center tracking-widest">CNC MANAGER</h2>
                        {error && <div className="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-6 text-sm text-center">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="label-text">Email</label>
                                <input type="email" required className="input-field" value={email} onChange={e => setEmail(e.target.value)} />
                            </div>
                            <div>
                                <label className="label-text">Пароль</label>
                                <input type="password" required className="input-field" value={password} onChange={e => setPassword(e.target.value)} />
                            </div>
                            <button type="submit" disabled={loading} className="btn-primary mt-4 w-full">
                                {loading ? 'Вход...' : 'Войти'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [authError, setAuthError] = useState("");

            const [activeTab, setActiveTab] = useState('dashboard');
            
            const [serviceSubTab, setServiceSubTab] = useState(null);
            const [serviceMachine, setServiceMachine] = useState(null);
            const [warehouseSubTab, setWarehouseSubTab] = useState(null);
            
            const [projects, setProjects] = useState([]);
            const [warehouse, setWarehouse] = useState([]);
            const [tools, setTools] = useState([]);
            const [toolLogs, setToolLogs] = useState([]);

            const [selectedProjectId, setSelectedProjectId] = useState(null);
            const [isCreatingProject, setIsCreatingProject] = useState(false);
            const [editingProject, setEditingProject] = useState(null);

            const [searchQuery, setSearchQuery] = useState("");
            const [filterStatus, setFilterStatus] = useState("all");

            useEffect(() => {
                const handlePopState = () => { window.dispatchEvent(new Event('app-back', { cancelable: true })); };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                const onAppBack = (e) => {
                    if (e.defaultPrevented) return;
                    if (isCreatingProject || editingProject) {
                        setIsCreatingProject(false); setEditingProject(null); e.preventDefault();
                    } else if (selectedProjectId) {
                        setSelectedProjectId(null); e.preventDefault();
                    }
                };
                window.addEventListener('app-back', onAppBack);
                return () => window.removeEventListener('app-back', onAppBack);
            }, [isCreatingProject, editingProject, selectedProjectId]);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser && !currentUser.isAnonymous) {
                        setUser(currentUser);
                    } else {
                        setUser(null);
                    }
                    setIsAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const handleLogin = async (email, password) => {
                try {
                    setAuthError("");
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    console.error("Ошибка входа:", err);
                    setAuthError("Неверный email или пароль");
                    throw err;
                }
            };

            const handleLogout = async () => {
                if (window.confirm("Выйти из аккаунта?")) {
                    await auth.signOut();
                }
            };

            useEffect(() => {
                if (!user) return;
                const unsubProjects = getDbRef('projects').onSnapshot((snap) => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() }))), console.error);
                const unsubWarehouse = getDbRef('warehouse').onSnapshot((snap) => setWarehouse(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
                const unsubTools = getDbRef('tools').onSnapshot((snap) => setTools(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
                const unsubToolLogs = getDbRef('toolLogs').onSnapshot((snap) => setToolLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)), console.error);
                return () => { unsubProjects(); unsubWarehouse(); unsubTools(); unsubToolLogs(); };
            }, [user]);

            const filteredAndSortedProjects = useMemo(() => {
                let sorted = [...projects].sort((a, b) => {
                    if (a.finishDate && !b.finishDate) return 1;
                    if (!a.finishDate && b.finishDate) return -1;
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    sorted = sorted.filter(p => (p.name && p.name.toLowerCase().includes(q)) || (p.customer && p.customer.toLowerCase().includes(q)));
                }
                
                if (filterStatus === 'active') {
                    sorted = sorted.filter(p => !p.finishDate);
                } else if (filterStatus === 'finished') {
                    sorted = sorted.filter(p => p.finishDate);
                }
                return sorted;
            }, [projects, searchQuery, filterStatus]);

            const handleLogToolChange = async (toolId, machineName, typeCategory) => {
                if (!user) return;
                try {
                    const now = new Date();
                    const payload = {
                        machine: machineName, date: now.toLocaleDateString('ru-RU'), time: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), timestamp: now.getTime(), type: typeCategory || 'knives'
                    };
                    if (typeCategory === 'knives' && toolId) {
                        const toolItem = tools.find(t => t.id === toolId);
                        if (toolItem) {
                            payload.toolId = toolItem.id; payload.toolName = toolItem.name;
                            await getDbRef('tools').doc(toolItem.id).update({ quantity: toolItem.quantity - 1 });
                        }
                    }
                    await getDbRef('toolLogs').add(payload);
                } catch (err) { alert("Ошибка фиксации."); }
            };

            const handleUpdateToolLog = async (logId, toolId, machine, date, time) => {
                if (!user) return;
                const payload = { machine, date, time };
                if (toolId) {
                    const toolItem = tools.find(t => t.id === toolId);
                    if (toolItem) { payload.toolId = toolItem.id; payload.toolName = toolItem.name; }
                }
                await getDbRef('toolLogs').doc(logId).update(payload);
            };

            const handleDeleteToolLog = async (id) => {
                if (window.confirm("Удалить эту запись из истории?")) await getDbRef('toolLogs').doc(id).delete();
            };

            const handleUpdateMaterial = async (projectId, materialId, delta) => {
                if (!user) return;
                const project = projects.find(p => p.id === projectId);
                if (!project || !project.materials) return;
                const matIndex = project.materials.findIndex(m => m.id === materialId);
                if (matIndex === -1) return;

                const mat = project.materials[matIndex];
                const newDone = mat.done + delta;
                if (newDone < 0 || newDone > mat.total) return;

                try {
                    const updatedMaterials = [...project.materials];
                    updatedMaterials[matIndex].done = newDone;
                    const isFinished = updatedMaterials.every(m => m.done === m.total);

                    await getDbRef('projects').doc(projectId).update({
                        materials: updatedMaterials, finishDate: isFinished ? new Date().toLocaleDateString('ru-RU') : null
                    });

                    const warehouseItem = warehouse.find(w => w.name === mat.name);
                    if (warehouseItem) await getDbRef('warehouse').doc(warehouseItem.id).update({ quantity: warehouseItem.quantity - delta });
                } catch (err) { console.error("Ошибка обновления:", err); }
            };

            const handleSaveProject = async (customerStr, nameStr, mats, editingId = null, startDateStr, endDateStr, driveLinkStr, notesStr) => {
                if (!user || !nameStr.trim()) return;
                const payload = {
                    customer: customerStr.trim(), name: nameStr.trim(),
                    driveLink: driveLinkStr ? driveLinkStr.trim() : '',
                    endDate: endDateStr ? endDateStr.trim() : '',
                    notes: notesStr ? notesStr.trim() : '',
                    materials: mats.filter(m => m.name.trim() !== '').map((m, i) => ({ id: m.id || Date.now() + i, name: m.name, total: Number(m.total), done: m.done || 0 }))
                };

                const isFinished = payload.materials.length > 0 && payload.materials.every(m => m.done === m.total);
                payload.finishDate = isFinished ? new Date().toLocaleDateString('ru-RU') : null;

                if (editingId) {
                    payload.startDate = startDateStr;
                    await getDbRef('projects').doc(editingId).update(payload);
                } else {
                    payload.startDate = startDateStr || new Date().toLocaleDateString('ru-RU');
                    payload.timestamp = Date.now();
                    await getDbRef('projects').add(payload);
                }
                setIsCreatingProject(false); setEditingProject(null);
            };

            const handleDeleteProject = async (projectId) => {
                if (!user) return;
                try {
                    await getDbRef('projects').doc(projectId).delete();
                    if (selectedProjectId === projectId) setSelectedProjectId(null);
                    setIsCreatingProject(false); setEditingProject(null);
                } catch (err) { console.error("Ошибка удаления:", err); }
            };

            const handleAddInventory = async (itemData, collectionName) => {
                if (!user || !itemData.name.trim()) return;
                await getDbRef(collectionName).add({ ...itemData, timestamp: Date.now() });
            };

            const handleUpdateInventoryQty = async (id, currentQty, delta, collectionName) => {
                await getDbRef(collectionName).doc(id).update({ quantity: currentQty + delta });
            };

            const handleDeleteInventory = async (id, collectionName) => {
                if (window.confirm("Удалить позицию со склада навсегда?")) await getDbRef(collectionName).doc(id).delete();
            };

            const handleBulkImport = async (text, collectionName) => {
                if (!user || !text.trim()) return;
                const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                for (const line of lines) {
                    const currentItems = collectionName === 'warehouse' ? warehouse : tools;
                    if (!currentItems.find(i => i.name.toLowerCase() === line.toLowerCase())) {
                        await getDbRef(collectionName).add({ name: line, quantity: 0, timestamp: Date.now() });
                    }
                }
            };

            if (isAuthLoading) return <div className="min-h-screen bg-zinc-900 flex items-center justify-center text-zinc-400 font-bold tracking-widest text-sm font-medium">Загрузка данных...</div>;
            
            if (!user) return <LoginView onLogin={handleLogin} error={authError} />;

            const closeModals = () => { setSelectedProjectId(null); setIsCreatingProject(false); setEditingProject(null); };

            const goToProjectsWithFilter = (filter) => {
                setFilterStatus(filter);
                setActiveTab('projects');
                closeModals();
            };

            const goToServiceWithTab = (tab, machine) => {
                setServiceSubTab(tab);
                setServiceMachine(machine);
                setActiveTab('tool_log');
                closeModals();
            };

            const goToWarehouseWithTab = (tab) => {
                setWarehouseSubTab(tab);
                setActiveTab('warehouse');
                closeModals();
            };

            return (
                <div className="max-w-md mx-auto relative h-full min-h-screen bg-zinc-900 shadow-2xl">
                    <datalist id="warehouse-suggestions">
                        {warehouse.map(w => <option key={w.id} value={w.name} />)}
                    </datalist>

                    {isCreatingProject || editingProject ? (
                        <ProjectFormView projectToEdit={editingProject} onSave={handleSaveProject} onDelete={handleDeleteProject} onCancel={closeModals} warehouse={warehouse} />
                    ) : selectedProjectId ? (
                        <div className="p-4 pb-24">
                            {(() => {
                                const p = projects.find(pr => pr.id === selectedProjectId);
                                if (!p) return null;
                                const safeMaterials = p.materials || [];
                                const totalMats = safeMaterials.reduce((acc, m) => acc + m.total, 0);
                                const doneMats = safeMaterials.reduce((acc, m) => acc + m.done, 0);
                                const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                                const isFinished = p.finishDate;
                                const barColor = getProgressColor(percent);
                                const borderColor = getBorderColor(percent);

                                return (
                                    <>
                                        <div onClick={() => { setEditingProject(p); setIsCreatingProject(true); }} className={`card mb-6 border-2 cursor-pointer hover:bg-zinc-800/80 active:scale-95 transition-all relative ${isFinished ? 'bg-zinc-800/80' : ''} ${borderColor}`}>
                                            <div className="absolute top-3 right-3 text-zinc-600"><Icons.Edit /></div>
                                            <div className="text-center font-bold text-white text-xl mb-5 mt-2 leading-tight pr-6">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>
                                            <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                                                <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center"><span>{p.startDate}</span></div>
                                                <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>{isFinished ? (p.endDate || p.finishDate) : 'В работе'}</div>
                                                <div className="flex justify-center">{p.driveLink ? <a href={p.driveLink} target="_blank" onClick={(e) => e.stopPropagation()} className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}</div>
                                            </div>
                                            <div className="w-full bg-zinc-900 rounded-full h-6 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                                                <div className={`progress-bar h-6 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                <span className="absolute inset-0 flex items-center justify-center text-sm font-bold text-white text-shadow-sm">{percent}%</span>
                                            </div>
                                        </div>

                                        {p.notes && (
                                            <div onClick={() => { setEditingProject(p); setIsCreatingProject(true); }} className="card mb-6 border-zinc-700/50 cursor-pointer hover:bg-zinc-800/80 transition-colors">
                                                <h3 className="text-[12px] text-zinc-400 font-bold mb-2">Заметки по проекту:</h3>
                                                <p className="text-sm text-zinc-300 whitespace-pre-wrap">{p.notes}</p>
                                            </div>
                                        )}
                                    </>
                                );
                            })()}

                            <div className="space-y-4">
                                {(() => {
                                    const proj = projects.find(p => p.id === selectedProjectId);
                                    if (!proj || !proj.materials) return null;
                                    return proj.materials.map(mat => {
                                        const percent = mat.total === 0 ? 0 : Math.round((mat.done / mat.total) * 100);
                                        const barColor = getProgressColor(percent);
                                        return (
                                            <div key={mat.id} className="card">
                                                <div className="text-sm text-zinc-200 font-medium mb-3">{mat.name}</div>
                                                <div className="flex items-center justify-between mb-3">
                                                    <div className="text-2xl font-bold text-white tracking-wide">{mat.done} / {mat.total}</div>
                                                    <div className="flex space-x-2">
                                                        <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, -1)} className="btn-icon w-12 h-10"><Icons.Minus /></button>
                                                        <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, 1)} className={`w-14 h-10 rounded-lg flex items-center justify-center active:scale-95 transition-all shadow-lg ${percent === 100 ? 'bg-zinc-700 opacity-50 text-white' : 'btn-blue !p-0'}`}>{percent === 100 ? <Icons.Check /> : <Icons.Plus />}</button>
                                                    </div>
                                                </div>
                                                <div className="w-full bg-zinc-900 rounded-full h-4 relative overflow-hidden mt-1 shadow-inner">
                                                    <div className={`progress-bar h-4 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                    <span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white text-shadow-sm">{percent}%</span>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        </div>
                    ) : (
                        <>
                            {activeTab === 'dashboard' && <DashboardView projects={projects} warehouse={warehouse} tools={tools} toolLogs={toolLogs} user={user} onLogout={handleLogout} goToProjects={goToProjectsWithFilter} goToService={goToServiceWithTab} goToWarehouse={goToWarehouseWithTab} />}
                            
                            {activeTab === 'projects' && (
                                <div className="p-4 pb-24">
                                    <div className="flex justify-center mb-6 mt-2">
                                        <h1 className="text-3xl font-bold text-white tracking-widest text-center">Проекты</h1>
                                    </div>
                                    <div className="flex justify-center mb-6 mt-2 space-x-2 bg-zinc-800 p-1 rounded-xl border border-zinc-700/50">
                                        <button onClick={() => setFilterStatus('all')} className={`flex-1 text-[12px] font-bold py-2 rounded-lg transition-colors ${filterStatus === 'all' ? 'bg-blue-600/50 text-blue-100 shadow-md' : 'text-zinc-500 hover:text-zinc-300'}`}>Все</button>
                                        <button onClick={() => setFilterStatus('active')} className={`flex-1 text-[12px] font-bold py-2 rounded-lg transition-colors ${filterStatus === 'active' ? 'bg-orange-600/50 text-orange-100 shadow-md' : 'text-zinc-500 hover:text-zinc-300'}`}>В работе</button>
                                        <button onClick={() => setFilterStatus('finished')} className={`flex-1 text-[12px] font-bold py-2 rounded-lg transition-colors ${filterStatus === 'finished' ? 'bg-green-600/50 text-green-100 shadow-md' : 'text-zinc-500 hover:text-zinc-300'}`}>Завершено</button>
                                    </div>

                                    <div className="mb-6 flex space-x-3 items-center">
                                        <div className="relative flex-1">
                                            <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-zinc-500"><Icons.Search /></div>
                                            <input type="text" className="input-field pl-10" placeholder="Поиск..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                                        </div>
                                        <button onClick={() => setIsCreatingProject(true)} className="btn-blue w-12 h-12 shrink-0 !p-0 flex items-center justify-center" title="Добавить проект"><Icons.Plus /></button>
                                    </div>
                                    {filteredAndSortedProjects.length === 0 && (
                                        <div className="text-center text-zinc-500 mt-10 p-8 border border-dashed border-zinc-700 rounded-xl bg-zinc-800/50">
                                            {searchQuery || filterStatus !== 'all' ? "В этой категории проектов нет" : "Нажмите на кнопку с плюсом, чтобы создать проект"}
                                        </div>
                                    )}
                                    <div className="space-y-4">
                                        {filteredAndSortedProjects.map(p => {
                                            const safeMats = p.materials || [];
                                            const totalMats = safeMats.reduce((acc, m) => acc + m.total, 0);
                                            const doneMats = safeMats.reduce((acc, m) => acc + m.done, 0);
                                            const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                                            const isFinished = p.finishDate;
                                            const barColor = getProgressColor(percent);
                                            const borderColor = getBorderColor(percent);
                                            return (
                                                <div key={p.id} onClick={() => setSelectedProjectId(p.id)} className={`card cursor-pointer border-2 active:scale-95 transition-transform ${isFinished ? 'opacity-75 bg-zinc-800/80' : ''} ${borderColor}`}>
                                                    <div className="text-center font-bold text-white text-lg mb-4 leading-tight">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>
                                                    <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                                                        <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center"><span>{p.startDate}</span></div>
                                                        <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>{isFinished ? (p.endDate || p.finishDate) : 'В работе'}</div>
                                                        <div className="flex justify-center">{p.driveLink ? <a href={p.driveLink} target="_blank" onClick={(e) => e.stopPropagation()} className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}</div>
                                                    </div>
                                                    <div className="w-full bg-zinc-900 rounded-full h-5 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                                                        <div className={`progress-bar h-5 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                        <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white text-shadow-sm">{percent}%</span>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}
                            
                            {activeTab === 'warehouse' && <UnifiedWarehouseView warehouse={warehouse} tools={tools} onAdd={handleAddInventory} onUpdateQty={handleUpdateInventoryQty} onDelete={handleDeleteInventory} onBulkImport={handleBulkImport} subTab={warehouseSubTab} setSubTab={setWarehouseSubTab} />}
                            
                            {activeTab === 'tool_log' && <ToolLogView tools={tools} toolLogs={toolLogs} onLogChange={handleLogToolChange} onDeleteLog={handleDeleteToolLog} onUpdateLog={handleUpdateToolLog} subTab={serviceSubTab} setSubTab={setServiceSubTab} activeMachine={serviceMachine} setActiveMachine={setServiceMachine} />}
                        </>
                    )}

                    {/* НАВИГАЦИЯ НА 4 ЭЛЕМЕНТА */}
                    <div className="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 flex justify-between pb-safe pt-2 px-2 z-50 max-w-md mx-auto shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                        <button onClick={() => { setActiveTab('dashboard'); closeModals(); }} className={`nav-item ${activeTab === 'dashboard' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Dashboard /><span>Аналитика</span>
                        </button>
                        <button onClick={() => { setActiveTab('projects'); closeModals(); }} className={`nav-item ${activeTab === 'projects' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Projects /><span>Проекты</span>
                        </button>
                        <button onClick={() => { setActiveTab('tool_log'); setServiceSubTab(null); setServiceMachine(null); closeModals(); }} className={`nav-item ${activeTab === 'tool_log' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Service /><span>Сервис</span>
                        </button>
                        <button onClick={() => { setActiveTab('warehouse'); setWarehouseSubTab(null); closeModals(); }} className={`nav-item ${activeTab === 'warehouse' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Warehouse /><span>Склад</span>
                        </button>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('Service Worker успешно зарегистрирован!'))
                    .catch(err => console.log('Ошибка регистрации Service Worker:', err));
            });
        }
    </script>
</body>
</html>
