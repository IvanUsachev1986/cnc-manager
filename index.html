<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Manager - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Анимация для прогресс-бара */
        .progress-bar { transition: width 0.5s ease-in-out, background-color 0.5s ease; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
          apiKey: "AIzaSyDAHKWem4N5NO4TYnEsAhC6KKAMrQsU8yA",
          authDomain: "cnc-manager-a6a06.firebaseapp.com",
          projectId: "cnc-manager-a6a06",
          storageBucket: "cnc-manager-a6a06.firebasestorage.app",
          messagingSenderId: "113877473214",
          appId: "1:113877473214:web:846ac76f7a11377d918bef"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cnc-manager-a6a06';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const Icons = {
            Cabinet: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="12" y1="10" x2="12" y2="22"/><circle cx="10" cy="16" r="1"/><circle cx="14" cy="16" r="1"/></svg>,
            Drill: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2v4l2 2v6l-2 2v6h-4v-6l-2-2V8l2-2V2z"/><path d="M10 8l4 4"/><path d="M10 14l4-4"/></svg>,
            Warehouse: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            Check: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Minus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ArrowLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
            Trash: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
            Upload: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            ExternalLink: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        };

        const getProgressColor = (percent) => {
            if (percent === 0) return 'bg-red-500';
            if (percent < 50) return 'bg-orange-500';
            if (percent < 100) return 'bg-yellow-400';
            return 'bg-green-500';
        };

        // --- ВЫНЕСЕННЫЕ КОМПОНЕНТЫ --- //

        const UnifiedWarehouseView = ({ warehouse, tools, onAdd, onUpdateQty, onDelete, onBulkImport }) => {
            const [subTab, setSubTab] = useState('materials');
            const [newName, setNewName] = useState('');
            const [newQty, setNewQty] = useState('');
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [bulkText, setBulkText] = useState('');

            const currentCollection = subTab === 'materials' ? 'warehouse' : 'tools';
            const currentItems = subTab === 'materials' ? warehouse : tools;
            const placeholderName = subTab === 'materials' ? 'Название материала...' : 'Название/Номер фрезы...';

            const add = () => {
                onAdd(newName, newQty, currentCollection);
                setNewName(''); setNewQty('');
            };

            const handleBulkSubmit = () => {
                onBulkImport(bulkText, currentCollection);
                setBulkText('');
                setIsBulkMode(false);
            };

            return (
                <div className="p-4 pb-24">
                    <div className="flex justify-between items-center mb-4">
                        <h1 className="text-2xl font-bold text-white">Управление складом</h1>
                    </div>
                    
                    {/* Переключатель */}
                    <div className="flex bg-slate-800 p-1 rounded-lg mb-6 shadow-inner">
                        <button className={`flex-1 py-2 rounded-md text-sm font-bold transition-colors ${subTab==='materials'?'bg-blue-600 text-white shadow':'text-slate-400 hover:text-white'}`} onClick={()=>setSubTab('materials')}>Материалы</button>
                        <button className={`flex-1 py-2 rounded-md text-sm font-bold transition-colors ${subTab==='tools'?'bg-blue-600 text-white shadow':'text-slate-400 hover:text-white'}`} onClick={()=>setSubTab('tools')}>Фрезы</button>
                    </div>
                    
                    {/* Кнопка массовой загрузки */}
                    <button onClick={() => setIsBulkMode(!isBulkMode)} className="text-sm text-blue-400 mb-4 flex items-center space-x-1 hover:text-blue-300">
                        <Icons.Upload /> <span>{isBulkMode ? "Скрыть массовую загрузку" : "Массовая загрузка (из Excel)"}</span>
                    </button>

                    {/* Форма добавления */}
                    {isBulkMode ? (
                        <div className="bg-slate-800 p-4 rounded-xl border border-blue-900 mb-6">
                            <p className="text-xs text-slate-400 mb-2">Вставьте список из Excel/Таблиц (каждое название с новой строки):</p>
                            <textarea 
                                className="w-full bg-slate-900 border border-slate-700 p-3 rounded text-sm text-white outline-none focus:border-blue-500 h-32 mb-3" 
                                placeholder="Birch 16mm&#10;MDF 22mm&#10;Dikt 17..." 
                                value={bulkText} 
                                onChange={e=>setBulkText(e.target.value)}
                            />
                            <button onClick={handleBulkSubmit} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg shadow-lg">Загрузить списком</button>
                        </div>
                    ) : (
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 mb-6 flex space-x-2 shadow-lg">
                            <input list="warehouse-suggestions" className="flex-1 bg-slate-900 border border-slate-700 p-2 rounded text-sm text-white outline-none focus:border-blue-500" placeholder={placeholderName} value={newName} onChange={e=>setNewName(e.target.value)} />
                            <input type="number" className="w-16 bg-slate-900 border border-slate-700 p-2 rounded text-sm text-white text-center outline-none focus:border-blue-500" placeholder="Шт." value={newQty} onChange={e=>setNewQty(e.target.value)} />
                            <button onClick={add} className="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded flex items-center justify-center w-10 active:scale-95 shadow"><Icons.Plus /></button>
                        </div>
                    )}

                    {/* Список */}
                    <div className="space-y-3">
                        {currentItems.length === 0 && <div className="text-slate-500 text-sm text-center py-8 border border-dashed border-slate-700 rounded-xl">В этом разделе пока пусто</div>}
                        {currentItems.map(item => (
                            <div key={item.id} className="bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center shadow-md">
                                <div className="flex flex-col overflow-hidden">
                                    <span className="text-sm text-slate-200 font-medium truncate pr-2">{item.name}</span>
                                    <button onClick={() => onDelete(item.id, currentCollection)} className="text-[10px] text-slate-500 hover:text-red-400 text-left mt-1 w-fit transition-colors">удалить</button>
                                </div>
                                <div className="flex items-center space-x-3 bg-slate-900 p-1 rounded-lg shrink-0 border border-slate-800">
                                    <button onClick={() => onUpdateQty(item.id, item.quantity, -1, currentCollection)} className="text-slate-400 hover:text-white w-6 h-6 flex justify-center items-center rounded bg-slate-800 active:scale-95"><Icons.Minus /></button>
                                    <span className={`w-8 text-center font-bold ${item.quantity <= 0 ? 'text-red-500' : 'text-blue-400'}`}>{item.quantity}</span>
                                    <button onClick={() => onUpdateQty(item.id, item.quantity, 1, currentCollection)} className="text-slate-400 hover:text-white w-6 h-6 flex justify-center items-center rounded bg-slate-800 active:scale-95"><Icons.Plus /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ToolLogView = ({ tools, toolLogs, onLogChange, onUpdateLog, onDeleteLog }) => {
            const [selectedTool, setSelectedTool] = useState("");
            const [selectedMachine, setSelectedMachine] = useState("1. KATZ CNC");
            const [editingLogId, setEditingLogId] = useState(null);

            // Состояния для редактирования
            const [editTool, setEditTool] = useState("");
            const [editMachine, setEditMachine] = useState("");
            const [editDate, setEditDate] = useState("");
            const [editTime, setEditTime] = useState("");

            const startEdit = (log) => {
                setEditingLogId(log.id);
                setEditTool(log.toolId);
                setEditMachine(log.machine || "1. KATZ CNC");
                setEditDate(log.date);
                setEditTime(log.time);
            };

            const saveEdit = () => {
                onUpdateLog(editingLogId, editTool, editMachine, editDate, editTime);
                setEditingLogId(null);
            };

            const submitNewLog = () => {
                onLogChange(selectedTool, selectedMachine);
                setSelectedTool("");
            };

            return (
                <div className="p-4 pb-24">
                    <h1 className="text-2xl font-bold text-white mb-6">Замена ножей</h1>
                    
                    {/* Форма фиксации (скрыта, если редактируем) */}
                    {!editingLogId && (
                        <div className="bg-slate-800 p-4 rounded-xl border border-blue-900/50 mb-8 shadow-lg shadow-blue-900/10">
                            <h3 className="text-sm font-bold text-white mb-3">Новая запись:</h3>
                            <div className="space-y-3 mb-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Станок:</label>
                                    <select className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white outline-none focus:border-blue-500" value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)}>
                                        <option value="1. KATZ CNC">1. KATZ CNC</option>
                                        <option value="2. Holcer CNC">2. Holcer CNC</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Фреза:</label>
                                    <select className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white outline-none focus:border-blue-500" value={selectedTool} onChange={e => setSelectedTool(e.target.value)}>
                                        <option value="">-- Выберите из наличия --</option>
                                        {tools.map(t => <option key={t.id} value={t.id}>{t.name} ({t.quantity} шт.)</option>)}
                                    </select>
                                </div>
                            </div>
                            <button onClick={submitNewLog} disabled={!selectedTool} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold p-3 rounded-lg shadow-lg active:scale-95 transition-transform">Зафиксировать</button>
                        </div>
                    )}

                    {/* Форма редактирования */}
                    {editingLogId && (
                        <div className="bg-slate-800 p-4 rounded-xl border border-yellow-600/50 mb-8 shadow-lg">
                            <h3 className="text-sm font-bold text-yellow-500 mb-3">Редактирование записи:</h3>
                            <div className="space-y-3 mb-4">
                                <div className="flex space-x-2">
                                    <div className="flex-1">
                                        <label className="block text-[10px] text-slate-400 mb-1">Дата:</label>
                                        <input type="text" className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white" value={editDate} onChange={e=>setEditDate(e.target.value)} />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-[10px] text-slate-400 mb-1">Время:</label>
                                        <input type="text" className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white" value={editTime} onChange={e=>setEditTime(e.target.value)} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-slate-400 mb-1">Станок:</label>
                                    <select className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white" value={editMachine} onChange={e => setEditMachine(e.target.value)}>
                                        <option value="1. KATZ CNC">1. KATZ CNC</option>
                                        <option value="2. Holcer CNC">2. Holcer CNC</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-[10px] text-slate-400 mb-1">Фреза:</label>
                                    <select className="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white" value={editTool} onChange={e => setEditTool(e.target.value)}>
                                        {tools.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                    </select>
                                </div>
                            </div>
                            <div className="flex space-x-2">
                                <button onClick={() => setEditingLogId(null)} className="flex-1 bg-slate-700 text-white font-bold p-3 rounded-lg">Отмена</button>
                                <button onClick={saveEdit} className="flex-1 bg-green-600 text-white font-bold p-3 rounded-lg">Сохранить</button>
                            </div>
                        </div>
                    )}

                    {/* История */}
                    <h2 className="text-sm text-slate-400 font-bold tracking-wider mb-3 px-1">История замен</h2>
                    <div className="space-y-3">
                        {toolLogs.length === 0 && <div className="p-4 text-center text-slate-500 border border-dashed border-slate-700 rounded-xl">Нет записей</div>}
                        {toolLogs.map(log => (
                            <div key={log.id} className={`bg-slate-800 p-3 rounded-xl border flex justify-between items-center shadow-md ${editingLogId === log.id ? 'border-yellow-500' : 'border-slate-700'}`}>
                                <div>
                                    <div className="text-xs text-slate-400 mb-1">{log.date} — {log.time}</div>
                                    <div className="font-bold text-white text-sm">{log.toolName}</div>
                                    <div className="text-xs text-blue-400 font-medium mt-1">{log.machine}</div>
                                </div>
                                <div className="flex flex-col space-y-2 shrink-0 ml-4">
                                    <button onClick={() => startEdit(log)} className="text-slate-400 hover:text-white bg-slate-900 p-2 rounded-lg border border-slate-700 active:scale-95"><Icons.Edit /></button>
                                    <button onClick={() => onDeleteLog(log.id)} className="text-slate-500 hover:text-red-400 bg-slate-900 p-2 rounded-lg border border-slate-700 active:scale-95"><Icons.Trash /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ProjectFormView = ({ projectToEdit, onSave, onCancel, warehouse }) => {
            const [name, setName] = useState(projectToEdit ? projectToEdit.name : '');
            const [startDate, setStartDate] = useState(projectToEdit ? projectToEdit.startDate : new Date().toLocaleDateString('ru-RU'));
            const [driveLink, setDriveLink] = useState(projectToEdit ? (projectToEdit.driveLink || '') : '');
            const [mats, setMats] = useState(projectToEdit && projectToEdit.materials.length > 0 
                ? projectToEdit.materials 
                : [{ id: Date.now(), name: '', total: 1, done: 0 }]);

            const addRow = () => setMats([...mats, { id: Date.now(), name: '', total: 1, done: 0 }]);
            const upd = (id, f, v) => setMats(mats.map(m => m.id === id ? { ...m, [f]: v } : m));
            const rm = (id) => setMats(mats.filter(m => m.id !== id));

            return (
                <div className="p-4 pb-24">
                    <button onClick={onCancel} className="text-blue-400 mb-4 flex items-center -ml-2 p-2 hover:text-blue-300"><Icons.ArrowLeft /> Назад</button>
                    <h1 className="text-2xl font-bold text-white mb-6">{projectToEdit ? "Редактирование проекта" : "Создать проект"}</h1>
                    
                    <div className="space-y-4 mb-8">
                        <div>
                            <label className="text-xs text-slate-400 mb-1 block">Название проекта:</label>
                            <input className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white font-medium outline-none focus:border-blue-500 shadow-inner" placeholder="Например: Кухня 1" value={name} onChange={e=>setName(e.target.value)} />
                        </div>

                        <div className="flex space-x-3">
                            <div className="flex-1">
                                <label className="text-xs text-slate-400 mb-1 block">Дата начала:</label>
                                <input className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white font-medium outline-none focus:border-blue-500 shadow-inner" placeholder="ДД.ММ.ГГГГ" value={startDate} onChange={e=>setStartDate(e.target.value)} />
                            </div>
                        </div>

                        <div>
                            <label className="text-xs text-slate-400 mb-1 block">Ссылка на Google Drive:</label>
                            <input className="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-white font-medium outline-none focus:border-blue-500 shadow-inner" placeholder="https://drive.google.com/..." value={driveLink} onChange={e=>setDriveLink(e.target.value)} />
                        </div>
                        
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md mt-6">
                            <label className="text-xs text-slate-400 mb-4 block font-bold uppercase tracking-wider">План резки (Материалы)</label>
                            {mats.map(m => (
                                <div key={m.id} className="flex space-x-2 mb-3 items-center">
                                    <input list="warehouse-suggestions" className="flex-1 bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white focus:border-blue-500 outline-none" placeholder="Материал" value={m.name} onChange={e=>upd(m.id, 'name', e.target.value)} />
                                    <input type="number" min="1" className="w-16 bg-slate-900 border border-slate-700 p-2 rounded-lg text-sm text-white text-center focus:border-blue-500 outline-none" value={m.total} onChange={e=>upd(m.id, 'total', e.target.value)} />
                                    <button onClick={() => rm(m.id)} className="text-slate-500 hover:text-red-400 p-2 bg-slate-900 rounded-lg"><Icons.Trash /></button>
                                </div>
                            ))}
                            <button onClick={addRow} className="text-sm text-blue-400 font-medium mt-3 flex items-center p-2 -ml-2 rounded-lg hover:bg-slate-700 transition-colors"><Icons.Plus /> Добавить материал</button>
                        </div>
                    </div>
                    <button 
                        onClick={() => onSave(name, mats, projectToEdit ? projectToEdit.id : null, startDate, driveLink)} 
                        disabled={!name.trim()} 
                        className="w-full bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white font-bold p-4 rounded-xl shadow-lg active:scale-95 transition-transform"
                    >
                        {projectToEdit ? "Сохранить изменения" : "Запустить проект"}
                    </button>
                </div>
            );
        };

        // --- ГЛАВНЫЙ КОМПОНЕНТ APP --- //

        function App() {
          const [user, setUser] = useState(null);
          const [isAuthLoading, setIsAuthLoading] = useState(true);
          const [authError, setAuthError] = useState("");
          
          const [activeTab, setActiveTab] = useState('projects'); 
          
          const [projects, setProjects] = useState([]);
          const [warehouse, setWarehouse] = useState([]);
          const [tools, setTools] = useState([]);
          const [toolLogs, setToolLogs] = useState([]);

          const [selectedProjectId, setSelectedProjectId] = useState(null);
          const [isCreatingProject, setIsCreatingProject] = useState(false);
          const [editingProject, setEditingProject] = useState(null);

          // 1. Авторизация
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) {
                console.error("Auth error:", error);
                setAuthError("Ошибка авторизации. Проверьте настройки Firebase.");
                setIsAuthLoading(false);
              }
            };
            initAuth();

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) { setUser(currentUser); setAuthError(""); }
              setIsAuthLoading(false);
            });
            return () => unsubscribe();
          }, []);

          // 2. Слушатели БД
          useEffect(() => {
            if (!user) return;

            const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);

            const unsubProjects = onSnapshot(getCol('projects'), (snap) => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)), console.error);
            const unsubWarehouse = onSnapshot(getCol('warehouse'), (snap) => setWarehouse(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
            const unsubTools = onSnapshot(getCol('tools'), (snap) => setTools(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
            const unsubToolLogs = onSnapshot(getCol('toolLogs'), (snap) => setToolLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)), console.error);

            return () => { unsubProjects(); unsubWarehouse(); unsubTools(); unsubToolLogs(); };
          }, [user]);

          // --- ЛОГИКА ФРЕЗ (ЖУРНАЛ) ---
          const handleLogToolChange = async (toolId, machineName) => {
            if (!user) return;
            const toolItem = tools.find(t => t.id === toolId);
            if (!toolItem) return;

            try {
                const now = new Date();
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'toolLogs'), {
                    toolId: toolItem.id,
                    toolName: toolItem.name,
                    machine: machineName,
                    date: now.toLocaleDateString('ru-RU'),
                    time: now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
                    timestamp: now.getTime()
                });
                // Списываем со склада
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tools', toolId), { quantity: toolItem.quantity - 1 });
            } catch (err) { alert("Ошибка фиксации."); }
          };

          const handleUpdateToolLog = async (logId, toolId, machine, date, time) => {
              if(!user) return;
              const toolItem = tools.find(t => t.id === toolId);
              const toolName = toolItem ? toolItem.name : "Неизвестная фреза";
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', logId), {
                  toolId, toolName, machine, date, time
              });
          };

          const handleDeleteToolLog = async (id) => {
              if(window.confirm("Удалить эту запись из истории?")) {
                  await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', id));
              }
          };

          // --- ЛОГИКА ПРОЕКТОВ ---
          const handleUpdateMaterial = async (projectId, materialId, delta) => {
            if (!user) return;
            const project = projects.find(p => p.id === projectId);
            if (!project) return;
            const matIndex = project.materials.findIndex(m => m.id === materialId);
            if (matIndex === -1) return;
            
            const mat = project.materials[matIndex];
            const newDone = mat.done + delta;
            if (newDone < 0 || newDone > mat.total) return; 

            try {
                const updatedMaterials = [...project.materials];
                updatedMaterials[matIndex].done = newDone;
                
                const isFinished = updatedMaterials.every(m => m.done === m.total);
                const finishDate = isFinished ? new Date().toLocaleDateString('ru-RU') : null;

                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId), { 
                    materials: updatedMaterials, finishDate: finishDate
                });

                // Автоматизация: списание со склада
                const warehouseItem = warehouse.find(w => w.name === mat.name);
                if (warehouseItem) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'warehouse', warehouseItem.id), { 
                        quantity: warehouseItem.quantity - delta 
                    });
                }
            } catch (err) { console.error("Ошибка обновления:", err); }
          };

          const handleSaveProject = async (name, mats, editingId = null, startDateStr, driveLinkStr) => {
              if (!user || !name.trim()) return;
              
              const payload = {
                  name,
                  driveLink: driveLinkStr ? driveLinkStr.trim() : '',
                  materials: mats.filter(m => m.name.trim() !== '').map((m, i) => ({
                      id: m.id || Date.now() + i, 
                      name: m.name, total: Number(m.total), done: m.done || 0
                  }))
              };

              const isFinished = payload.materials.length > 0 && payload.materials.every(m => m.done === m.total);
              payload.finishDate = isFinished ? new Date().toLocaleDateString('ru-RU') : null;

              if (editingId) {
                  payload.startDate = startDateStr;
                  await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', editingId), payload);
              } else {
                  payload.startDate = startDateStr || new Date().toLocaleDateString('ru-RU');
                  payload.timestamp = Date.now();
                  await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), payload);
              }
              
              setIsCreatingProject(false); setEditingProject(null);
          };

          // --- ЛОГИКА СКЛАДА ---
          const handleAddInventory = async (name, qtyStr, collectionName) => {
              if (!user || !name.trim()) return;
              await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
                  name: name.trim(), quantity: Number(qtyStr) || 0, timestamp: Date.now()
              });
          };

          const handleUpdateInventoryQty = async (id, currentQty, delta, collectionName) => {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), { quantity: currentQty + delta });
          };

          const handleDeleteInventory = async (id, collectionName) => {
              if(window.confirm("Удалить позицию со склада навсегда?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
          };

          const handleBulkImport = async (text, collectionName) => {
              if (!user || !text.trim()) return;
              const lines = text.split('\n').map(l => l.trim()).filter(l => l);
              for (const line of lines) {
                  const currentItems = collectionName === 'warehouse' ? warehouse : tools;
                  if (!currentItems.find(i => i.name.toLowerCase() === line.toLowerCase())) {
                      await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
                          name: line, quantity: 0, timestamp: Date.now()
                      });
                  }
              }
          };

          // Экран загрузки
          if (isAuthLoading) return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-slate-400">Подключение...</div>;
          if (authError) return <div className="min-h-screen bg-slate-900 flex items-center justify-center p-6 text-center text-red-400 font-bold">{authError}</div>;

          return (
            <div className="max-w-md mx-auto relative h-full min-h-screen bg-slate-900 shadow-2xl">
              {/* DataList для подсказок при вводе материалов */}
              <datalist id="warehouse-suggestions">
                  {warehouse.map(w => <option key={w.id} value={w.name} />)}
              </datalist>

              {/* РОУТИНГ */}
              {isCreatingProject || editingProject ? (
                  <ProjectFormView 
                      projectToEdit={editingProject} 
                      onSave={handleSaveProject} 
                      onCancel={()=>{setIsCreatingProject(false); setEditingProject(null);}} 
                      warehouse={warehouse} 
                  />
              ) : selectedProjectId ? (
                  <div className="p-4 pb-24">
                      <div className="flex justify-between items-center mb-4">
                          <button onClick={() => setSelectedProjectId(null)} className="text-blue-400 flex items-center -ml-2 p-2 rounded-lg hover:text-blue-300 transition-colors"><Icons.ArrowLeft /> К списку</button>
                          <button onClick={() => { setEditingProject(projects.find(p=>p.id===selectedProjectId)); setIsCreatingProject(true); }} className="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-lg border border-slate-700 flex items-center space-x-1 shadow transition-colors">
                              <Icons.Edit /> <span className="text-xs">Правка</span>
                          </button>
                      </div>
                      
                      <div className="mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                          <h1 className="text-2xl font-bold text-white mb-3">{projects.find(p=>p.id===selectedProjectId)?.name}</h1>
                          <div className="flex flex-col space-y-2 text-xs font-medium">
                              <span className="text-slate-400">Начат: <span className="text-slate-200">{projects.find(p=>p.id===selectedProjectId)?.startDate}</span></span>
                              {projects.find(p=>p.id===selectedProjectId)?.finishDate ? (
                                  <span className="text-green-400 font-bold flex items-center"><Icons.Check /> Завершен: {projects.find(p=>p.id===selectedProjectId)?.finishDate}</span>
                              ) : (
                                  <span className="text-blue-400">В работе...</span>
                              )}
                              
                              {projects.find(p=>p.id===selectedProjectId)?.driveLink && (
                                  <a href={projects.find(p=>p.id===selectedProjectId).driveLink} target="_blank" rel="noopener noreferrer" className="mt-3 inline-flex items-center space-x-1 text-blue-400 hover:text-blue-300 bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs w-fit active:scale-95 transition-transform">
                                      <Icons.ExternalLink /> <span>Папка в Google Drive</span>
                                  </a>
                              )}
                          </div>
                      </div>
                      
                      <div className="space-y-3">
                          {projects.find(p=>p.id===selectedProjectId)?.materials.map(mat => {
                              const isDone = mat.done === mat.total;
                              return (
                                  <div key={mat.id} className={`p-4 rounded-xl border transition-colors shadow-md ${isDone ? 'bg-green-900/20 border-green-800/50' : 'bg-slate-800 border-slate-700'}`}>
                                      <div className="text-sm text-slate-200 font-medium mb-4">{mat.name}</div>
                                      <div className="flex items-center justify-between">
                                          <div className="text-2xl font-bold text-white w-20">{mat.done} <span className="text-lg text-slate-500">/ {mat.total}</span></div>
                                          <div className="flex space-x-2">
                                              <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, -1)} className="w-12 h-12 bg-slate-700 hover:bg-slate-600 rounded-xl flex items-center justify-center active:scale-95 transition-transform shadow"><Icons.Minus /></button>
                                              <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, 1)} className={`w-16 h-12 rounded-xl flex items-center justify-center active:scale-95 transition-all shadow-lg ${isDone ? 'bg-slate-700 opacity-50' : 'bg-blue-600 hover:bg-blue-500'}`}>{isDone ? <Icons.Check /> : <Icons.Plus />}</button>
                                          </div>
                                      </div>
                                  </div>
                              );
                          })}
                      </div>
                  </div>
              ) : (
                  <>
                      {activeTab === 'projects' && (
                          <div className="p-4 pb-24">
                              <div className="flex justify-between items-center mb-6">
                                  <h1 className="text-2xl font-bold text-white">Проекты в работе</h1>
                                  <button onClick={() => setIsCreatingProject(true)} className="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl shadow-lg active:scale-95 transition-transform"><Icons.Plus /></button>
                              </div>
                              {projects.length === 0 && <div className="text-center text-slate-500 mt-10 p-8 border border-dashed border-slate-700 rounded-xl bg-slate-800/50">Нажмите "+" чтобы создать проект</div>}
                              <div className="space-y-4">
                                  {projects.map(p => {
                                      const totalMats = p.materials.reduce((acc, m) => acc + m.total, 0);
                                      const doneMats = p.materials.reduce((acc, m) => acc + m.done, 0);
                                      const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                                      const isFinished = p.finishDate;
                                      const barColor = getProgressColor(percent);
                                      
                                      return (
                                          <div key={p.id} onClick={() => setSelectedProjectId(p.id)} className={`p-4 rounded-xl border cursor-pointer active:scale-95 transition-transform shadow-lg ${isFinished ? 'bg-green-900/10 border-green-900/30' : 'bg-slate-800 border-slate-700'}`}>
                                              <div className="flex justify-between items-start mb-3">
                                                  <h2 className="font-bold text-white text-lg leading-tight pr-2">{p.name}</h2>
                                                  <span className={`text-[10px] font-bold px-2 py-1 rounded shrink-0 ${isFinished ? 'bg-green-800 text-green-100' : 'bg-slate-700 text-slate-300'}`}>
                                                      {isFinished ? 'Завершен' : `с ${p.startDate}`}
                                                  </span>
                                              </div>
                                              <div className="flex justify-between text-xs text-slate-400 mb-1 font-medium">
                                                  <span>Прогресс</span>
                                                  <span>{percent}%</span>
                                              </div>
                                              <div className="w-full bg-slate-900 rounded-full h-2">
                                                  <div className={`progress-bar h-2 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                              </div>
                                          </div>
                                      )
                                  })}
                              </div>
                          </div>
                      )}
                      
                      {activeTab === 'warehouse' && (
                          <UnifiedWarehouseView 
                              warehouse={warehouse} tools={tools} 
                              onAdd={handleAddInventory} onUpdateQty={handleUpdateInventoryQty} onDelete={handleDeleteInventory} onBulkImport={handleBulkImport}
                          />
                      )}
                      {activeTab === 'tool_log' && (
                          <ToolLogView 
                              tools={tools} toolLogs={toolLogs} 
                              onLogChange={handleLogToolChange} onDeleteLog={handleDeleteToolLog} onUpdateLog={handleUpdateToolLog}
                          />
                      )}
                  </>
              )}

              {/* НАВИГАЦИЯ (3 ВКЛАДКИ) */}
              {!selectedProjectId && !isCreatingProject && !editingProject && (
                  <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around pb-safe pt-2 px-2 z-50 max-w-md mx-auto shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                      <button onClick={() => setActiveTab('projects')} className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab==='projects'?'text-blue-500':'text-slate-500 hover:text-slate-300'}`}>
                          <Icons.Cabinet />
                          <span className="text-[10px] mt-1 font-bold">Проекты</span>
                      </button>
                      <button onClick={() => setActiveTab('tool_log')} className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab==='tool_log'?'text-blue-500':'text-slate-500 hover:text-slate-300'}`}>
                          <Icons.Drill />
                          <span className="text-[10px] mt-1 font-bold">Замена ножей</span>
                      </button>
                      <button onClick={() => setActiveTab('warehouse')} className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab==='warehouse'?'text-blue-500':'text-slate-500 hover:text-slate-300'}`}>
                          <Icons.Warehouse />
                          <span className="text-[10px] mt-1 font-bold">Склад</span>
                      </button>
                  </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
