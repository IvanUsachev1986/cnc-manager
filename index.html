<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Manager - Cloud Edition</title>
    <!-- Подключаем библиотеки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // Импортируем Firebase напрямую из CDN (работает прямо в браузере)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect } = React;

        // --- 1. ТВОЯ КОНФИГУРАЦИЯ FIREBASE ---
        const firebaseConfig = {
          apiKey: "AIzaSyDAHKWem4N5NO4TYnEsAhC6KKAMrQsU8yA",
          authDomain: "cnc-manager-a6a06.firebaseapp.com",
          projectId: "cnc-manager-a6a06",
          storageBucket: "cnc-manager-a6a06.firebasestorage.app",
          messagingSenderId: "113877473214",
          appId: "1:113877473214:web:846ac76f7a11377d918bef"
        };

        // Инициализация сервисов Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'cnc-app';

        // Иконки
        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Tool: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
            Warehouse: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        };

        // Полные тестовые данные из твоих таблиц
        const initialProjects = [
          {
            id: "proj_1", name: "Gross Siemens", startDate: "6.05.2026",
            materials: [
              { id: 101, name: "MDF G Yazuk 22mm (2750 * 1220)", total: 6, done: 0 },
              { id: 102, name: "Birch 16mm FrmGraf (2440 * 1220)", total: 34, done: 0 },
              { id: 103, name: "Birch 6mm Grafit (2440 * 1220)", total: 9, done: 0 },
              { id: 104, name: "MDF G Yazuk 19mm (2440 * 1220)", total: 7, done: 0 },
              { id: 105, name: "Birch 12 Black (2440 * 1220)", total: 1, done: 0 },
              { id: 106, name: "Birch 18 EgozAmeri 3m", total: 1, done: 0 },
              { id: 107, name: "Dikt 17 EgozAmerik (2440 * 1220)", total: 6, done: 0 },
              { id: 108, name: "MDF 8mm (2440 * 1220)", total: 1, done: 0 },
              { id: 109, name: "Birch 16 EgozAmeri", total: 11, done: 0 }
            ]
          },
          {
            id: "proj_2", name: "Rukman proekt", startDate: "14.05.2026",
            materials: [
              { id: 201, name: "Dikt 17 Alon (2440 * 1220)", total: 15, done: 0 },
              { id: 202, name: "Dikt 5 AlonMesunhran", total: 9, done: 0 },
              { id: 203, name: "Dikt 17 Alon 6080-17.1", total: 5, done: 0 },
              { id: 204, name: "Birch 18mm (2440 * 1220)", total: 1, done: 0 },
              { id: 205, name: "MDF G Yazuk 17mm", total: 2, done: 0 },
              { id: 206, name: "MDF G Yazuk 22mm", total: 2, done: 0 },
              { id: 207, name: "MDF 17 FornirAlon 2", total: 6, done: 0 },
              { id: 208, name: "MDF 17 FornirAlon 1", total: 2, done: 0 }
            ]
          }
        ];

        const initialInventory = [
          "Birch 16mm (2440 * 1220)", "Birch 16mm Grain (2435 * 1215)", "Birch 18mm (2440 * 1220)",
          "Dikt 17 Alon (2440 * 1220)", "Dikt 17 Alon 6080-16.7 (2440 * 1220)", "Dikt 17 FrmGraft (2440 * 1220)",
          "Front Aluminium Grafit (2440 * 1220)", "HDF 19mm FibraTop (2440 * 1220)"
        ];

        function App() {
          const [user, setUser] = useState(null);
          const [isAuthLoading, setIsAuthLoading] = useState(true);
          
          const [activeTab, setActiveTab] = useState('projects');
          const [projects, setProjects] = useState([]);
          const [selectedProjectId, setSelectedProjectId] = useState(null);
          const [toolsLog, setToolsLog] = useState([]);
          const [isDataLoaded, setIsDataLoaded] = useState(false);

          // 2. Авторизация при входе
          useEffect(() => {
            const initAuth = async () => {
              try {
                await signInAnonymously(auth);
              } catch (error) {
                console.error("Auth error:", error);
              }
            };
            initAuth();

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              setIsAuthLoading(false);
            });
            return () => unsubscribe();
          }, []);

          // 3. Подключение к облаку в реальном времени (слушаем данные)
          useEffect(() => {
            if (!user) return; // Ждем пока зайдем

            // Пути в базе данных (Общие для телефона и компьютера)
            const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
            const toolsRef = collection(db, 'artifacts', appId, 'public', 'data', 'toolsLog');

            const unsubProjects = onSnapshot(projectsRef, (snapshot) => {
              const projs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              // Сортируем по ID (чтобы не прыгали)
              projs.sort((a, b) => a.id.localeCompare(b.id));
              setProjects(projs);
              setIsDataLoaded(true);
            }, (err) => console.error("DB Error:", err));

            const unsubTools = onSnapshot(toolsRef, (snapshot) => {
              const tools = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              tools.sort((a, b) => b.timestamp - a.timestamp); // Новые сверху
              setToolsLog(tools);
            }, (err) => console.error("DB Error:", err));

            return () => {
              unsubProjects();
              unsubTools();
            };
          }, [user]);

          // --- 4. ДЕЙСТВИЯ: ОТПРАВКА В ОБЛАКО ---

          const handleUpdateMaterial = async (projectId, materialId, newDoneValue) => {
            if (!user) return;
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            // Обновляем массив материалов
            const updatedMaterials = project.materials.map(mat => {
              if (mat.id === materialId) {
                const validDone = Math.max(0, Math.min(newDoneValue, mat.total));
                return { ...mat, done: validDone };
              }
              return mat;
            });

            // Отправляем в Firebase
            const projectDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId);
            await updateDoc(projectDocRef, { materials: updatedMaterials });
          };

          const handleAddToolLog = async () => {
            if (!user) return;
            const toolNum = window.prompt("Введите номер инструмента/фрезы (например: 38):", "");
            if (toolNum) {
              const now = new Date();
              const dateStr = now.toLocaleDateString('ru-RU');
              const timeStr = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
              
              const toolsRef = collection(db, 'artifacts', appId, 'public', 'data', 'toolsLog');
              await addDoc(toolsRef, { 
                date: dateStr, 
                time: timeStr, 
                tool: toolNum,
                timestamp: now.getTime()
              });
            }
          };

          // Кнопка для первой загрузки базы данных (тестовыми данными из CSV)
          const handleSeedDatabase = async () => {
            if (!user) return;
            const projectsRef = collection(db, 'artifacts', appId, 'public', 'data', 'projects');
            for (const proj of initialProjects) {
              await setDoc(doc(projectsRef, proj.id), proj);
            }
          };

          // --- UI КОМПОНЕНТЫ ---

          const renderProgressBar = (materials) => {
            const totalSheets = materials.reduce((acc, mat) => acc + mat.total, 0);
            const doneSheets = materials.reduce((acc, mat) => acc + mat.done, 0);
            const percent = totalSheets === 0 ? 0 : Math.round((doneSheets / totalSheets) * 100);

            return (
              <div className="w-full mt-3">
                <div className="flex justify-between text-xs text-gray-400 mb-1">
                  <span>Готово: {doneSheets} из {totalSheets}</span>
                  <span className="font-bold text-blue-400">{percent}%</span>
                </div>
                <div className="w-full bg-slate-700 rounded-full h-2.5">
                  <div className="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style={{ width: `${percent}%` }}></div>
                </div>
              </div>
            );
          };

          const ProjectListView = () => (
            <div className="p-4 pb-24 space-y-4">
              <h1 className="text-2xl font-bold text-white mb-6">Проекты в работе</h1>
              
              {/* Если база пуста, показываем кнопку загрузки */}
              {projects.length === 0 && isDataLoaded && (
                <div className="bg-slate-800 p-6 rounded-xl text-center border border-dashed border-slate-600">
                  <p className="text-slate-400 mb-4">База данных пуста.</p>
                  <button 
                    onClick={handleSeedDatabase}
                    className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg active:scale-95 transition-transform"
                  >
                    Загрузить тестовые данные
                  </button>
                </div>
              )}

              {projects.map(proj => (
                <div 
                  key={proj.id} 
                  onClick={() => setSelectedProjectId(proj.id)}
                  className="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 active:scale-95 transition-transform cursor-pointer"
                >
                  <div className="flex justify-between items-start">
                    <h2 className="text-lg font-semibold text-white">{proj.name}</h2>
                    <span className="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">
                      с {proj.startDate}
                    </span>
                  </div>
                  {renderProgressBar(proj.materials)}
                </div>
              ))}
            </div>
          );

          const ProjectDetailView = () => {
            const project = projects.find(p => p.id === selectedProjectId);
            if (!project) return null;

            return (
              <div className="p-4 pb-24">
                <button 
                  onClick={() => setSelectedProjectId(null)}
                  className="flex items-center text-blue-400 mb-4 p-2 -ml-2 active:bg-slate-800 rounded-lg"
                >
                  <Icons.ArrowLeft /> <span className="ml-2 font-medium">Назад к списку</span>
                </button>
                
                <h1 className="text-2xl font-bold text-white mb-2">{project.name}</h1>
                <div className="mb-6">{renderProgressBar(project.materials)}</div>

                <div className="space-y-3">
                  {project.materials.map(mat => {
                    const isComplete = mat.done === mat.total;
                    return (
                      <div key={mat.id} className={`p-4 rounded-xl border transition-colors ${isComplete ? 'bg-green-900/20 border-green-800/50' : 'bg-slate-800 border-slate-700'}`}>
                        <div className="text-sm text-slate-300 mb-3">{mat.name}</div>
                        
                        <div className="flex items-center justify-between">
                          <div className="text-2xl font-bold text-white w-16 text-center">
                            {mat.done} <span className="text-lg text-slate-500">/ {mat.total}</span>
                          </div>
                          
                          <div className="flex space-x-2">
                            <button 
                              onClick={() => handleUpdateMaterial(project.id, mat.id, mat.done - 1)}
                              className="w-12 h-12 bg-slate-700 rounded-xl flex justify-center items-center text-white active:bg-slate-600 disabled:opacity-30 transition-opacity"
                              disabled={mat.done === 0}
                            >
                              <Icons.Minus />
                            </button>
                            <button 
                              onClick={() => handleUpdateMaterial(project.id, mat.id, mat.done + 1)}
                              className={`w-16 h-12 rounded-xl flex justify-center items-center text-white font-bold text-xl active:scale-95 transition-all ${isComplete ? 'bg-slate-700 opacity-50' : 'bg-blue-600 shadow-lg shadow-blue-900/50'}`}
                              disabled={isComplete}
                            >
                              {isComplete ? <Icons.Check /> : <Icons.Plus />}
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          };

          const ToolLogView = () => (
            <div className="p-4 pb-24">
              <h1 className="text-2xl font-bold text-white mb-6">Журнал инструмента</h1>
              <button 
                onClick={handleAddToolLog}
                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl mb-6 shadow-lg active:scale-95 transition-transform flex justify-center items-center"
              >
                <Icons.Plus /> <span className="ml-2">Зафиксировать замену</span>
              </button>

              <div className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                <table className="w-full text-left text-slate-300">
                  <thead className="bg-slate-900/50 text-xs uppercase text-slate-500">
                    <tr>
                      <th className="px-4 py-3">Дата</th>
                      <th className="px-4 py-3">Время</th>
                      <th className="px-4 py-3">Фреза</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {toolsLog.length === 0 ? (
                      <tr><td colSpan="3" className="px-4 py-6 text-center text-slate-500">Нет записей</td></tr>
                    ) : (
                      toolsLog.map((log) => (
                        <tr key={log.id}>
                          <td className="px-4 py-3">{log.date}</td>
                          <td className="px-4 py-3">{log.time}</td>
                          <td className="px-4 py-3 font-bold text-white">#{log.tool}</td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          );

          const InventoryView = () => (
            <div className="p-4 pb-24">
              <h1 className="text-2xl font-bold text-white mb-6">Справочник склада</h1>
              <div className="space-y-2">
                {initialInventory.map((item, idx) => (
                  <div key={idx} className="bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm text-slate-300">
                    {item}
                  </div>
                ))}
              </div>
            </div>
          );

          // Экран загрузки
          if (isAuthLoading) {
            return (
              <div className="min-h-screen flex items-center justify-center text-slate-400 bg-slate-900">
                <div className="animate-pulse flex flex-col items-center">
                  <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                  Подключение к базе данных...
                </div>
              </div>
            );
          }

          return (
            <div className="max-w-md mx-auto relative h-full min-h-screen bg-slate-900 shadow-2xl">
              {/* Верхняя часть для контента */}
              {selectedProjectId ? (
                <ProjectDetailView />
              ) : (
                <>
                  {activeTab === 'projects' && <ProjectListView />}
                  {activeTab === 'tools' && <ToolLogView />}
                  {activeTab === 'warehouse' && <InventoryView />}
                </>
              )}

              {/* Нижняя навигация */}
              {!selectedProjectId && (
                <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-sm border-t border-slate-800 flex justify-around pb-safe pt-2 px-2 z-50 max-w-md mx-auto">
                  <button 
                    onClick={() => setActiveTab('projects')}
                    className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab === 'projects' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-400'}`}
                  >
                    <Icons.Home />
                    <span className="text-[10px] mt-1 font-medium">Проекты</span>
                  </button>
                  
                  <button 
                    onClick={() => setActiveTab('tools')}
                    className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab === 'tools' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-400'}`}
                  >
                    <Icons.Tool />
                    <span className="text-[10px] mt-1 font-medium">Инструмент</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('warehouse')}
                    className={`flex flex-col items-center p-2 min-w-[80px] rounded-lg transition-colors ${activeTab === 'warehouse' ? 'text-blue-500' : 'text-slate-500 hover:text-slate-400'}`}
                  >
                    <Icons.Warehouse />
                    <span className="text-[10px] mt-1 font-medium">Склад</span>
                  </button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
