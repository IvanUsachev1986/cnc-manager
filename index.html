<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style type="text/tailwindcss">
        @layer components {
            .card { @apply bg-zinc-800 p-4 rounded-xl border border-zinc-700 shadow-lg; }
            .card-hover { @apply bg-zinc-800 p-5 rounded-xl border border-zinc-700 shadow-lg flex justify-between items-center cursor-pointer active:scale-95 transition-transform hover:bg-zinc-700; }
            .input-field { @apply w-full bg-zinc-900 border border-zinc-700 p-3 rounded-lg text-sm text-white outline-none focus:border-blue-500 shadow-inner; }
            .input-sm { @apply bg-zinc-900 border border-zinc-700 p-2 rounded-lg text-sm text-white focus:border-blue-500 outline-none shadow-inner; }
            .btn-primary { @apply w-full bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white font-bold p-4 rounded-xl shadow-lg active:scale-95 transition-transform; }
            .btn-blue { @apply bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center; }
            .btn-icon { @apply text-zinc-400 hover:text-white bg-zinc-900 p-2 rounded-lg border border-zinc-700 active:scale-95 transition-colors flex items-center justify-center; }
            .label-text { @apply block text-[10px] text-zinc-400 mb-1 uppercase tracking-wider font-bold; }
            .nav-item { @apply flex flex-col items-center p-2 min-w-[70px] rounded-lg transition-colors; }
            .text-title { @apply text-3xl font-bold text-white hover:text-blue-400 transition-colors tracking-widest outline-none active:scale-95; }
        }
    </style>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #18181b;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        .progress-bar {
            transition: width 0.5s ease-in-out, background-color 0.5s ease;
        }

        .text-shadow-sm {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body class="bg-zinc-900 text-zinc-200 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo } = React;

        let firebaseConfig;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : {
                apiKey: "AIzaSyDt7SZC0XiStcwXnTZNsyRRiXOhB30gjt0",
                authDomain: "cnc-manager-a6a06.firebaseapp.com",
                projectId: "cnc-manager-a6a06",
                storageBucket: "cnc-manager-a6a06.firebasestorage.app",
                messagingSenderId: "113877473214",
                appId: "1:113877473214:web:846ac76f7a11377d918bef"
            };

        } catch (e) {
            console.error("Firebase config parsing error", e);
            firebaseConfig = {};
        }
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cnc-manager-a6a06';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- ГЛОБАЛЬНЫЙ МЕНЕДЖЕР ИСТОРИИ ---
        const pushAppHistory = () => {
            window.history.pushState({ modal: true }, '');
        };

        // --- ИКОНКИ (исправлен JSX синтаксис) ---
        const Icons = {
            Projects: () => <svg className="w-10 h-10" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 2L2 7l10 5 10-5-10-5z" />
                <path strokeLinecap="round" strokeLinejoin="round" d="M2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>,
            Service: () => <svg className="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="2" strokeWidth="2" />
                <circle cx="12" cy="12" r="7" strokeWidth="4.5" strokeDasharray="3.5 2" strokeDashoffset="0.8" />
            </svg>,
            Warehouse: () => <svg className="w-10 h-10" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 7v10l10 5M22 7v10l-10 5M12 12v10" />
            </svg>,
            GoogleDrive: () => <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
                <path strokeLinecap="round" strokeLinejoin="round" d="M8 12h4M8 16h8" />
            </svg>,
            Search: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
            Check: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="20 6 9 17 4 12" /></svg>,
            Plus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Minus: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ArrowLeft: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
            Trash: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Edit: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>,
            Upload: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Download: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            ChevronRight: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline></svg>,
            Setting: () => <svg className="w-10 h-10" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                <circle cx="16" cy="6" r="1.5" />
                <circle cx="8" cy="12" r="1.5" />
                <circle cx="14" cy="18" r="1.5" />
            </svg>
        };

        const getProgressColor = (percent) => {
            if (percent === 0) return 'bg-red-500';
            if (percent < 50) return 'bg-orange-500';
            if (percent < 100) return 'bg-yellow-400';
            return 'bg-green-500';
        };

        const getBorderColor = (percent) => {
            if (percent === 0) return 'border-red-500';
            if (percent < 50) return 'border-orange-500';
            if (percent < 100) return 'border-yellow-400';
            return 'border-green-500';
        };

        const DrillDownCard = ({ title, onClick }) => (
            <div onClick={onClick} className="card-hover">
                <div className="font-bold text-white text-xl">{title}</div>
                <div className="text-zinc-500"><Icons.ChevronRight /></div>
            </div>
        );

        // --- ВЫНЕСЕННЫЕ КОМПОНЕНТЫ --- //

        const UnifiedWarehouseView = ({ warehouse, tools, onAdd, onUpdateQty, onDelete, onBulkImport }) => {
            const [subTab, setSubTab] = useState(null);
            const [bulkMode, setBulkMode] = useState(false);
            const [bulkText, setBulkText] = useState('');

            const [showForm, setShowForm] = useState(false);
            const [qty, setQty] = useState('');

            const [mName, setMName] = useState('');
            const [mThick, setMThick] = useState('');
            const [mColor, setMColor] = useState('');
            const [mSize, setMSize] = useState('');

            const [tName, setTName] = useState('');
            const [tSize, setTSize] = useState('');

            if (!subTab) {
                return (
                    <div className="p-4 pb-24">
                        <div className="flex justify-center mb-8 mt-2">
                            <h1 className="text-3xl font-bold text-white tracking-widest">Склад</h1>
                        </div>
                        <div className="space-y-4">
                            <DrillDownCard title="Материалы" onClick={() => { pushAppHistory(); setSubTab('materials'); }} />
                            <DrillDownCard title="Фрезы" onClick={() => { pushAppHistory(); setSubTab('tools'); }} />
                        </div>
                    </div>
                );
            }

            const currentCollection = subTab === 'materials' ? 'warehouse' : 'tools';
            const currentItems = subTab === 'materials' ? warehouse : tools;
            const title = subTab === 'materials' ? 'Материалы' : 'Фрезы';

            const handleAddMaterial = () => {
                if (!mName) return;
                const fullName = `${mName} ${mThick} ${mColor} ${mSize}`.trim().replace(/\s+/g, ' ');

                onAdd({
                    name: fullName,
                    quantity: Number(qty) || 0,
                    details: { mName, mThick, mColor, mSize }
                }, currentCollection);

                setMName(''); setMThick(''); setMColor(''); setMSize(''); setQty('');
                window.history.back();
            };

            const handleAddTool = () => {
                if (!tName) return;
                const fullName = tSize ? `${tName} ${tSize}`.trim() : tName;
                onAdd({
                    name: fullName,
                    quantity: Number(qty) || 0,
                    details: { tName, tSize }
                }, currentCollection);

                setTName(''); setTSize(''); setQty('');
                window.history.back();
            };

            const handleBulkSubmit = () => {
                onBulkImport(bulkText, currentCollection);
                setBulkText(''); setBulkMode(false);
                window.history.back();
            };

            return (
                <div className="p-4 pb-24">
                    <div className="flex items-center mb-6">
                        <h1 onClick={() => setShowForm(!showForm)} className="text-xl font-bold text-white ml-2 cursor-pointer flex items-center gap-2 hover:text-blue-400 transition-colors active:scale-95">
                            {title} <div className="text-blue-500"><Icons.Plus /></div>
                        </h1>
                    </div>

                    <div className="flex space-x-2 mb-4">
                        <button onClick={() => { setBulkMode(!bulkMode); setShowForm(false); }} className="flex-1 text-[10px] uppercase font-bold text-blue-400 bg-zinc-800 border border-zinc-700 py-3 rounded-lg flex items-center justify-center space-x-2 hover:bg-zinc-700 active:scale-95 transition-all">
                            <Icons.Upload /> <span>Загрузить (Excel)</span>
                        </button>
                        <button className="flex-1 text-[10px] uppercase font-bold text-green-400 bg-zinc-800 border border-zinc-700 py-3 rounded-lg flex items-center justify-center space-x-2 hover:bg-zinc-700 active:scale-95 transition-all">
                            <Icons.Download /> <span>Выгрузить (Excel)</span>
                        </button>
                    </div>

                    {bulkMode && (
                        <div className="card mb-6 border-zinc-700">
                            <p className="label-text">Вставьте столбец с названиями из Excel:</p>
                            <textarea className="input-field h-32 mb-3" placeholder={"ДСП 16мм\nМДФ 22мм..."} value={bulkText} onChange={e => setBulkText(e.target.value)} />
                            <button onClick={handleBulkSubmit} className="btn-blue w-full">Импортировать списком</button>
                        </div>
                    )}

                    {showForm && !bulkMode && (
                        <div className="card mb-6 border-zinc-700">
                            <h3 className="text-sm font-bold text-white mb-3 flex justify-between items-center">
                                Добавить {subTab === 'materials' ? 'материал' : 'фрезу'}
                                <button onClick={() => setShowForm(false)} className="text-zinc-500 hover:text-white"><Icons.Minus /></button>
                            </h3>

                            {subTab === 'materials' ? (
                                <div className="space-y-3">
                                    <input className="input-sm w-full" placeholder="Название (напр. ДСП)" value={mName} onChange={e => setMName(e.target.value)} />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input className="input-sm w-full" placeholder="Толщина (16mm)" value={mThick} onChange={e => setMThick(e.target.value)} />
                                        <input className="input-sm w-full" placeholder="Цвет" value={mColor} onChange={e => setMColor(e.target.value)} />
                                    </div>
                                    <div className="grid grid-cols-[1fr_80px] gap-2">
                                        <input className="input-sm w-full" placeholder="Размер (1200*2440)" value={mSize} onChange={e => setMSize(e.target.value)} />
                                        <input type="number" className="input-sm w-full text-center" placeholder="Шт." value={qty} onChange={e => setQty(e.target.value)} />
                                    </div>
                                    <button onClick={handleAddMaterial} className="btn-blue w-full">Добавить материал</button>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <div className="flex space-x-2">
                                        <input className="input-sm flex-1" placeholder="Название/Номер (напр. Фреза прямая)" value={tName} onChange={e => setTName(e.target.value)} />
                                        <input className="input-sm w-1/3" placeholder="Размер (6*24)" value={tSize} onChange={e => setTSize(e.target.value)} />
                                    </div>
                                    <input type="number" className="input-sm w-full text-center" placeholder="Количество (Шт.)" value={qty} onChange={e => setQty(e.target.value)} />
                                    <button onClick={handleAddTool} className="btn-blue w-full">Добавить фрезу</button>
                                </div>
                            )}
                        </div>
                    )}

                    <div className="space-y-3">
                        {currentItems.length === 0 && <div className="text-zinc-500 text-sm text-center py-8 border border-dashed border-zinc-700 rounded-xl">В этом разделе пока пусто</div>}
                        {currentItems.map(item => (
                            <div key={item.id} className="bg-zinc-800 p-3 rounded-lg border border-zinc-700 flex justify-between items-center shadow-md">
                                <div className="flex flex-col overflow-hidden">
                                    <span className="text-sm text-zinc-200 font-medium truncate pr-2">
                                        {subTab === 'materials' && item.details ? (
                                            <>
                                                {item.details.mName} <span className="text-blue-400 font-bold">{item.details.mThick}</span>
                                                <span className="text-zinc-400"> {item.details.mColor} {item.details.mSize}</span>
                                            </>
                                        ) : subTab === 'tools' && item.details?.tName ? (
                                            <>
                                                {item.details.tName} <span className="text-blue-400 font-bold">{item.details.tSize}</span>
                                            </>
                                        ) : (
                                            item.name
                                        )}
                                    </span>
                                    <button onClick={() => onDelete(item.id, currentCollection)} className="text-[10px] text-zinc-500 hover:text-red-400 text-left mt-1 w-fit transition-colors uppercase font-bold">удалить</button>
                                </div>

                                <div className="flex items-center space-x-3 bg-zinc-900 p-1 rounded-lg shrink-0 border border-zinc-800">
                                    <button onClick={() => onUpdateQty(item.id, item.quantity, -1, currentCollection)} className="btn-icon h-5"><Icons.Minus /></button>
                                    <span className={`w-8 text-center font-bold ${item.quantity <= 0 ? 'text-red-500' : 'text-blue-400'}`}>{item.quantity}</span>
                                    <button onClick={() => onUpdateQty(item.id, item.quantity, 1, currentCollection)} className="btn-icon h-5"><Icons.Plus /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ToolLogView = ({ tools, toolLogs, onLogChange, onUpdateLog, onDeleteLog }) => {
            const [subTab, setSubTab] = useState(null);
            const [isCreatingLog, setIsCreatingLog] = useState(false);
            const [selectedTool, setSelectedTool] = useState("");
            const [selectedMachine, setSelectedMachine] = useState("1. KATZ CNC");
            const [editingLogId, setEditingLogId] = useState(null);

            const [editTool, setEditTool] = useState("");
            const [editMachine, setEditMachine] = useState("");
            const [editDate, setEditDate] = useState("");
            const [editTime, setEditTime] = useState("");

            if (!subTab) {
                return (
                    <div className="p-4 pb-24">
                        <div className="flex justify-center mb-8 mt-2">
                            <h1 className="text-3xl font-bold text-white tracking-widest">Сервис</h1>
                        </div>
                        <div className="space-y-4">
                            <DrillDownCard title="Замена ножей" onClick={() => setSubTab('knives')} />
                            <DrillDownCard title="Чистка фильтров" onClick={() => setSubTab('filters')} />
                            <DrillDownCard title="Рабочие часы" onClick={() => setSubTab('hours')} />
                        </div>
                    </div>
                );
            }

            const isKnives = subTab === 'knives';
            // Динамический заголовок в зависимости от подкатегории
            const title = isKnives ? 'Замена ножей' : (subTab === 'filters' ? 'Чистка фильтров' : 'Рабочие часы');

            const filteredLogs = toolLogs.filter(log => (log.type || 'knives') === subTab);

            const startEdit = (log) => {
                setEditingLogId(log.id);
                setEditTool(log.toolId || "");
                setEditMachine(log.machine || "1. KATZ CNC");
                setEditDate(log.date);
                setEditTime(log.time);
            };

            const saveEdit = () => {
                onUpdateLog(editingLogId, isKnives ? editTool : null, editMachine, editDate, editTime);
                setEditingLogId(null);
            };

            const submitNewLog = () => {
                onLogChange(isKnives ? selectedTool : null, selectedMachine, subTab);
                setSelectedTool("");
                setIsCreatingLog(false);
            };

            if (isCreatingLog) {
                return (
                    <div className="p-4 pb-24">
                        <h1 className="text-2xl font-bold text-white mb-6">
                            {isKnives ? "Новая замена" : (subTab === 'filters' ? "Новая чистка" : "Новая запись")}
                        </h1>

                        <div className="card">
                            <div className="space-y-4 mb-6">
                                <div>
                                    <label className="label-text">Станок:</label>
                                    <select className="input-field" value={selectedMachine} onChange={e => setSelectedMachine(e.target.value)}>
                                        <option value="1. KATZ CNC">1. KATZ CNC</option>
                                        <option value="2. Holcer CNC">2. Holcer CNC</option>
                                    </select>
                                </div>
                                {isKnives && (
                                    <div>
                                        <label className="label-text">Фреза (со склада):</label>
                                        <select className="input-field" value={selectedTool} onChange={e => setSelectedTool(e.target.value)}>
                                            <option value="">-- Выберите фрезу --</option>
                                            {tools.map(t => <option key={t.id} value={t.id}>{t.name} ({t.quantity} шт.)</option>)}
                                        </select>
                                    </div>
                                )}
                            </div>
                            <button onClick={submitNewLog} disabled={isKnives && !selectedTool} className="btn-primary">Зафиксировать</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 pb-24">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => setIsCreatingLog(true)} className="btn-blue w-12 h-12 !p-0"><Icons.Plus /></button>
                    </div>

                    {editingLogId && (
                        <div className="card mb-8 !border-yellow-600/50">
                            <h3 className="text-sm font-bold text-yellow-500 mb-3">Правка записи:</h3>
                            <div className="space-y-3 mb-4">
                                <div className="flex space-x-2">
                                    <div className="flex-1">
                                        <label className="label-text">Дата:</label>
                                        <input type="text" className="input-sm w-full" value={editDate} onChange={e => setEditDate(e.target.value)} />
                                    </div>
                                    <div className="flex-1">
                                        <label className="label-text">Время:</label>
                                        <input type="text" className="input-sm w-full" value={editTime} onChange={e => setEditTime(e.target.value)} />
                                    </div>
                                </div>
                                <div>
                                    <label className="label-text">Станок:</label>
                                    <select className="input-sm w-full" value={editMachine} onChange={e => setEditMachine(e.target.value)}>
                                        <option value="1. KATZ CNC">1. KATZ CNC</option>
                                        <option value="2. Holcer CNC">2. Holcer CNC</option>
                                    </select>
                                </div>
                                {isKnives && (
                                    <div>
                                        <label className="label-text">Фреза:</label>
                                        <select className="input-sm w-full" value={editTool} onChange={e => setEditTool(e.target.value)}>
                                            {tools.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                                        </select>
                                    </div>
                                )}
                            </div>
                            <div className="flex space-x-2">
                                <button onClick={() => setEditingLogId(null)} className="flex-1 bg-zinc-700 text-white font-bold p-3 rounded-lg">Отмена</button>
                                <button onClick={saveEdit} className="flex-1 bg-green-600 text-white font-bold p-3 rounded-lg">Сохранить</button>
                            </div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {filteredLogs.length === 0 && <div className="p-8 text-center text-zinc-500 border border-dashed border-zinc-700 rounded-xl bg-zinc-800/50">В этом разделе пока пусто</div>}
                        {filteredLogs.map(log => (
                            <div key={log.id} className={`card flex justify-between items-center ${editingLogId === log.id ? '!border-yellow-500' : ''}`}>
                                <div>
                                    <div className="label-text">{log.date} — {log.time}</div>
                                    <div className="font-bold text-white text-lg leading-tight mb-1">{isKnives ? log.toolName : (subTab === 'hours' ? 'Запись времени' : 'Очистка завершена')}</div>
                                    <div className="text-xs text-blue-400 font-bold bg-blue-900/20 px-2 py-1 rounded inline-block">{log.machine}</div>
                                </div>
                                <div className="flex flex-col space-y-2 shrink-0 ml-4 border-l border-zinc-700 pl-4">
                                    <button onClick={() => startEdit(log)} className="btn-icon"><Icons.Edit /></button>
                                    <button onClick={() => onDeleteLog(log.id)} className="btn-icon hover:!text-red-400"><Icons.Trash /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const ProjectFormView = ({ projectToEdit, onSave, onCancel, onDelete, warehouse }) => {
            const [customer, setCustomer] = useState(projectToEdit ? (projectToEdit.customer || '') : '');
            const [name, setName] = useState(projectToEdit ? projectToEdit.name : '');
            const [startDate, setStartDate] = useState(projectToEdit ? projectToEdit.startDate : new Date().toLocaleDateString('ru-RU'));
            const [endDate, setEndDate] = useState(projectToEdit ? (projectToEdit.endDate || projectToEdit.finishDate || '') : '');
            const [driveLink, setDriveLink] = useState(projectToEdit ? (projectToEdit.driveLink || '') : '');
            const [mats, setMats] = useState(projectToEdit && projectToEdit.materials && projectToEdit.materials.length > 0
                ? projectToEdit.materials
                : [{ id: Date.now(), name: '', total: 1, done: 0 }]);

            const [isImportMode, setIsImportMode] = useState(false);
            const [importText, setImportText] = useState("");

            const addRow = () => setMats([...mats, { id: Date.now(), name: '', total: 1, done: 0 }]);
            const upd = (id, f, v) => setMats(mats.map(m => m.id === id ? { ...m, [f]: v } : m));
            const rm = (id) => setMats(mats.filter(m => m.id !== id));

            // --- ОБНОВЛЕННЫЙ ПАРСЕР, ЧИТАЮЩИЙ ОБРЫВКИ PDF ---
            const handleParseImport = () => {
                if (!importText.trim()) {
                    setIsImportMode(false);
                    return;
                }

                let linesRaw = importText.replace(/\r\n/g, '\n').split('\n');
                let parsedMats = [];
                let currentNameBuffer = [];
                let expectingData = false;

                for (let i = 0; i < linesRaw.length; i++) {
                    let line = linesRaw[i].trim();
                    if (!line) continue;

                    // Очистка от кавычек
                    let cleanLine = line.replace(/"/g, '').trim();

                    // Вырезаем "Has Grain..." и всё, что за ним
                    cleanLine = cleanLine.replace(/has grain.*$/i, '').trim();
                    // Вырезаем цены
                    cleanLine = cleanLine.replace(/₪\s*[\d,.]+/g, '').replace(/₪\s*#+/g, '').replace(/₪/g, '').trim();

                    if (!cleanLine) continue;

                    // Пропускаем системный мусор
                    const lower = cleanLine.toLowerCase();
                    if (lower.includes('material summary') || lower.includes('job:') || lower.includes('description') || /^page \d/.test(lower)) continue;
                    if (/^\d{2}\/\d{2}\/\d{4}/.test(cleanLine)) continue; // Даты

                    // Пропускаем заголовки таблиц
                    if (/^(qty|width|length|thick|cost|\s|,)*$/i.test(cleanLine)) continue;
                    if (/^qty\s+width/i.test(cleanLine)) continue;

                    // 1. Ищем строку с данными
                    const dataMatch = cleanLine.match(/^(\d+)\s*(?:mm\s*)?([\d,.]+)(?:\s*mm)?\s+(?:x\s*|\*\s*)?([\d,.]+)(?:\s*mm)?/i);

                    if (dataMatch) {
                        let qty = parseInt(dataMatch[1], 10);
                        let width = dataMatch[2].replace(/,/g, '').split('.')[0];
                        let length = dataMatch[3].replace(/,/g, '').split('.')[0];

                        let fullName = currentNameBuffer.join(' ').trim();
                        if (fullName) {
                            let finalName = `${fullName} (${width}x${length})`;
                            parsedMats.push({ name: finalName, total: qty, done: 0 });
                        }
                        expectingData = true; // Ждем следующее название после данных
                        continue;
                    }

                    // 2. Иначе это кусок названия материала (накапливаем его)
                    if (expectingData) {
                        currentNameBuffer = [cleanLine];
                        expectingData = false;
                    } else {
                        currentNameBuffer.push(cleanLine);
                    }
                }

                // --- ФОЛЛБЕК НА ОБЫЧНЫЙ ТЕКСТ ---
                if (parsedMats.length === 0) {
                    linesRaw.forEach(line => {
                        let cleanLine = line.replace(/"/g, '').trim();
                        if (!cleanLine) return;
                        let m = cleanLine.match(/^(.*?)\s+(\d+)\s*(?:шт\.?|pcs\.?)?$/i);
                        if (m && m[1].length > 2) {
                            parsedMats.push({ name: m[1].trim(), total: parseInt(m[2]), done: 0 });
                        } else {
                            parsedMats.push({ name: cleanLine, total: 1, done: 0 });
                        }
                    });
                }

                // --- ГРУППИРОВКА ОДИНАКОВЫХ МАТЕРИАЛОВ ---
                const grouped = [];
                parsedMats.forEach(pm => {
                    let clean = pm.name.replace(/\s+/g, ' ').replace(/^:\s*/, '').trim();
                    const existing = grouped.find(g => g.name === clean);
                    if (existing) {
                        existing.total += pm.total;
                    } else if (clean) {
                        grouped.push({ id: Date.now() + Math.random(), name: clean, total: pm.total, done: 0 });
                    }
                });

                if (grouped.length > 0) {
                    if (mats.length === 1 && !mats[0].name) {
                        setMats(grouped);
                    } else {
                        setMats([...mats, ...grouped]);
                    }
                    setImportText('');
                    setIsImportMode(false);
                } else {
                    alert("Не удалось распознать материалы. Убедитесь, что скопировали кусок с названиями и количеством (Qty).");
                }
            };

            return (
                <div className="p-4 pb-24">
                    <div className="flex justify-center mb-6 mt-2">
                        <button onClick={() => onSave(customer, name, mats, projectToEdit ? projectToEdit.id : null, startDate, endDate, driveLink)} disabled={!name.trim()} className="text-title">
                            {projectToEdit ? "Редактирование" : "Создать проект"}
                        </button>
                    </div>


                    <div className="space-y-4 mb-8">
                        <div>
                            <label className="label-text">Заказчик (Клиент):</label>
                            <input className="input-field" placeholder="Имя заказчика или номер договора" value={customer} onChange={e => setCustomer(e.target.value)} />
                        </div>

                        <div>
                            <label className="label-text">Название проекта:</label>
                            <input className="input-field" placeholder="Например: Кухня 1" value={name} onChange={e => setName(e.target.value)} />
                        </div>

                        <div>
                            <label className="label-text">Даты проекта:</label>
                            <div className="flex space-x-2">
                                <input className="input-field flex-1" placeholder="Начало (ДД.ММ.ГГГГ)" value={startDate} onChange={e => setStartDate(e.target.value)} />
                                <input className="input-field flex-1" placeholder="Окончание (План)" value={endDate} onChange={e => setEndDate(e.target.value)} />
                            </div>
                        </div>

                        <div>
                            <label className="label-text">Ссылка на Google Drive (Чертежи):</label>
                            <input className="input-field" placeholder="https://drive.google.com/..." value={driveLink} onChange={e => setDriveLink(e.target.value)} />
                        </div>

                        <div className="card mt-6 relative">
                            <div className="flex justify-between items-center mb-4">
                                <label className="label-text !mb-0">План резки (Материалы)</label>
                                {!isImportMode && (
                                    <button onClick={() => setIsImportMode(true)} className="text-[10px] font-bold bg-blue-600/20 text-blue-400 px-3 py-1.5 rounded-lg hover:bg-blue-600/40 transition-colors">
                                        ⚡ Быстрый импорт
                                    </button>
                                )}
                            </div>

                            {isImportMode ? (
                                <div className="mb-4 bg-zinc-900 p-3 rounded-xl border border-zinc-700/50">
                                    <div className="text-xs text-zinc-400 mb-2">
                                        Вставьте скопированный текст из PDF. Умный алгоритм почистит мусор, найдет названия и правильно склеит количество.
                                    </div>
                                    <textarea
                                        className="input-field h-32 mb-3 text-xs font-mono leading-tight"
                                        placeholder="Вставляйте прямо как скопировалось из PDF..."
                                        value={importText}
                                        onChange={e => setImportText(e.target.value)}
                                    />
                                    <div className="flex space-x-2">
                                        <button onClick={() => setIsImportMode(false)} className="flex-1 bg-zinc-700 text-white font-bold p-2 rounded-lg text-sm">Отмена</button>
                                        <button onClick={handleParseImport} className="flex-1 bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">Распознать</button>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    {mats.map(m => (
                                        <div key={m.id} className="flex space-x-2 mb-3 items-center">
                                            <input list="warehouse-suggestions" className="input-sm flex-1" placeholder="Материал" value={m.name} onChange={e => upd(m.id, 'name', e.target.value)} />
                                            <input type="number" min="1" className="input-sm w-16 text-center" value={m.total} onChange={e => upd(m.id, 'total', e.target.value)} />
                                            <button onClick={() => rm(m.id)} className="btn-icon !p-2 hover:!text-red-400"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                    <button onClick={addRow} className="text-sm text-blue-400 font-medium mt-3 flex items-center p-2 -ml-2 rounded-lg hover:bg-zinc-700 transition-colors"><Icons.Plus /> Добавить вручную</button>
                                </>
                            )}
                        </div>
                        <div className="flex justify-center mb-6 mt-2">
                            <button onClick={() => onSave(customer, name, mats, projectToEdit ? projectToEdit.id : null, startDate, endDate, driveLink)} disabled={!name.trim()} className="text-title">
                                {projectToEdit ? "Редактирование" : "Создать проект"}
                            </button>
                        </div>

                        {projectToEdit && (
                            <div>
                                <button
                                    onClick={() => onDelete(projectToEdit.id)}
                                    className="bg-red-600 w-full text-white font-bold p-3 mt-4 rounded-xl shadow-lg active:scale-95 transition-transform"
                                >
                                    Удалить проект
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- ГЛАВНЫЙ КОМПОНЕНТ APP --- //

        function App() {
            const [user, setUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [authError, setAuthError] = useState("");

            const [activeTab, setActiveTab] = useState('projects');

            const [projects, setProjects] = useState([]);
            const [warehouse, setWarehouse] = useState([]);
            const [tools, setTools] = useState([]);
            const [toolLogs, setToolLogs] = useState([]);

            const [selectedProjectId, setSelectedProjectId] = useState(null);
            const [isCreatingProject, setIsCreatingProject] = useState(false);
            const [editingProject, setEditingProject] = useState(null);

            const [searchQuery, setSearchQuery] = useState("");
            const [filterStatus, setFilterStatus] = useState("all");

            // --- ГЛОБАЛЬНЫЙ ПЕРЕХВАТЧИК КНОПКИ НАЗАД ---
            useEffect(() => {
                const handlePopState = () => {
                    const event = new Event('app-back', { cancelable: true });
                    window.dispatchEvent(event);
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            useEffect(() => {
                const onAppBack = (e) => {
                    if (e.defaultPrevented) return;

                    if (isCreatingProject || editingProject) {
                        setIsCreatingProject(false);
                        setEditingProject(null);
                        e.preventDefault();
                    } else if (selectedProjectId) {
                        setSelectedProjectId(null);
                        e.preventDefault();
                    }
                };
                window.addEventListener('app-back', onAppBack);
                return () => window.removeEventListener('app-back', onAppBack);
            }, [isCreatingProject, editingProject, selectedProjectId]);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                        setAuthError("Ошибка авторизации. Проверьте настройки Firebase.");
                        setIsAuthLoading(false);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) { setUser(currentUser); setAuthError(""); }
                    setIsAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
                const unsubProjects = onSnapshot(getCol('projects'), (snap) => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() }))), console.error);
                const unsubWarehouse = onSnapshot(getCol('warehouse'), (snap) => setWarehouse(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
                const unsubTools = onSnapshot(getCol('tools'), (snap) => setTools(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
                const unsubToolLogs = onSnapshot(getCol('toolLogs'), (snap) => setToolLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)), console.error);
                return () => { unsubProjects(); unsubWarehouse(); unsubTools(); unsubToolLogs(); };
            }, [user]);

            const filteredAndSortedProjects = useMemo(() => {
                let sorted = [...projects].sort((a, b) => {
                    if (a.finishDate && !b.finishDate) return 1;
                    if (!a.finishDate && b.finishDate) return -1;
                    return (b.timestamp || 0) - (a.timestamp || 0);
                });

                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase();
                    sorted = sorted.filter(p =>
                        (p.name && p.name.toLowerCase().includes(q)) ||
                        (p.customer && p.customer.toLowerCase().includes(q))
                    );
                }

                if (filterStatus === 'active') {
                    sorted = sorted.filter(p => !p.finishDate);
                }

                return sorted;
            }, [projects, searchQuery, filterStatus]);

            const handleLogToolChange = async (toolId, machineName, typeCategory) => {
                if (!user) return;
                try {
                    const now = new Date();
                    const payload = {
                        machine: machineName, date: now.toLocaleDateString('ru-RU'), time: now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), timestamp: now.getTime(), type: typeCategory || 'knives'
                    };
                    if (typeCategory === 'knives' && toolId) {
                        const toolItem = tools.find(t => t.id === toolId);
                        if (toolItem) {
                            payload.toolId = toolItem.id; payload.toolName = toolItem.name;
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tools', toolItem.id), { quantity: toolItem.quantity - 1 });
                        }
                    }
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'toolLogs'), payload);
                } catch (err) { alert("Ошибка фиксации."); }
            };

            const handleUpdateToolLog = async (logId, toolId, machine, date, time) => {
                if (!user) return;
                const payload = { machine, date, time };
                if (toolId) {
                    const toolItem = tools.find(t => t.id === toolId);
                    if (toolItem) { payload.toolId = toolItem.id; payload.toolName = toolItem.name; }
                }
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', logId), payload);
            };

            const handleDeleteToolLog = async (id) => {
                if (window.confirm("Удалить эту запись из истории?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', id));
            };

            const handleUpdateMaterial = async (projectId, materialId, delta) => {
                if (!user) return;
                const project = projects.find(p => p.id === projectId);
                if (!project || !project.materials) return;
                const matIndex = project.materials.findIndex(m => m.id === materialId);
                if (matIndex === -1) return;

                const mat = project.materials[matIndex];
                const newDone = mat.done + delta;
                if (newDone < 0 || newDone > mat.total) return;

                try {
                    const updatedMaterials = [...project.materials];
                    updatedMaterials[matIndex].done = newDone;
                    const isFinished = updatedMaterials.every(m => m.done === m.total);

                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId), {
                        materials: updatedMaterials, finishDate: isFinished ? new Date().toLocaleDateString('ru-RU') : null
                    });

                    const warehouseItem = warehouse.find(w => w.name === mat.name);
                    if (warehouseItem) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'warehouse', warehouseItem.id), { quantity: warehouseItem.quantity - delta });
                } catch (err) { console.error("Ошибка обновления:", err); }
            };

            const handleSaveProject = async (customerStr, nameStr, mats, editingId = null, startDateStr, endDateStr, driveLinkStr) => {
                if (!user || !nameStr.trim()) return;
                const payload = {
                    customer: customerStr.trim(), name: nameStr.trim(),
                    driveLink: driveLinkStr ? driveLinkStr.trim() : '',
                    endDate: endDateStr ? endDateStr.trim() : '',
                    materials: mats.filter(m => m.name.trim() !== '').map((m, i) => ({ id: m.id || Date.now() + i, name: m.name, total: Number(m.total), done: m.done || 0 }))
                };

                const isFinished = payload.materials.length > 0 && payload.materials.every(m => m.done === m.total);
                payload.finishDate = isFinished ? new Date().toLocaleDateString('ru-RU') : null;

                if (editingId) {
                    payload.startDate = startDateStr;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', editingId), payload);
                } else {
                    payload.startDate = startDateStr || new Date().toLocaleDateString('ru-RU');
                    payload.timestamp = Date.now();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), payload);
                }
                setIsCreatingProject(false); setEditingProject(null);
            };

            const handleDeleteProject = async (projectId) => {
                if (!user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId));
                    if (selectedProjectId === projectId) {
                        setSelectedProjectId(null);
                    }
                    setIsCreatingProject(false);
                    setEditingProject(null);
                } catch (err) { console.error("Ошибка удаления:", err); }
            };

            const handleAddInventory = async (itemData, collectionName) => {
                if (!user || !itemData.name.trim()) return;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
                    ...itemData, timestamp: Date.now()
                });
            };

            const handleUpdateInventoryQty = async (id, currentQty, delta, collectionName) => {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), { quantity: currentQty + delta });
            };

            const handleDeleteInventory = async (id, collectionName) => {
                if (window.confirm("Удалить позицию со склада навсегда?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
            };

            const handleBulkImport = async (text, collectionName) => {
                if (!user || !text.trim()) return;
                const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                for (const line of lines) {
                    const currentItems = collectionName === 'warehouse' ? warehouse : tools;
                    if (!currentItems.find(i => i.name.toLowerCase() === line.toLowerCase())) {
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
                            name: line, quantity: 0, timestamp: Date.now()
                        });
                    }
                }
            };

            if (isAuthLoading) return <div className="min-h-screen bg-zinc-900 flex items-center justify-center text-zinc-400">Подключение...</div>;
            if (authError) return <div className="min-h-screen bg-zinc-900 flex items-center justify-center p-6 text-center text-red-400 font-bold">{authError}</div>;

            return (
                <div className="max-w-md mx-auto relative h-full min-h-screen bg-zinc-900 shadow-2xl">
                    <datalist id="warehouse-suggestions">
                        {warehouse.map(w => <option key={w.id} value={w.name} />)}
                    </datalist>

                    {/* РОУТИНГ */}
                    {isCreatingProject || editingProject ? (
                        <ProjectFormView
                            projectToEdit={editingProject}
                            onSave={handleSaveProject}
                            onDelete={handleDeleteProject}
                            onCancel={() => { setIsCreatingProject(false); setEditingProject(null); }}
                            warehouse={warehouse} />
                    ) : selectedProjectId ? (
                        <div className="p-4 pb-24">
                            <div className="flex justify-between items-center mb-6">
                                <button onClick={() => { setEditingProject(projects.find(p => p.id === selectedProjectId)); setIsCreatingProject(true); }} className="btn-icon w-10 h-10 shadow"><Icons.Edit /></button>
                            </div>

                            {/* Карточка проекта (Детальный вид) */}
                            {(() => {
                                const p = projects.find(pr => pr.id === selectedProjectId);
                                if (!p) return null;
                                const safeMaterials = p.materials || [];
                                const totalMats = safeMaterials.reduce((acc, m) => acc + m.total, 0);
                                const doneMats = safeMaterials.reduce((acc, m) => acc + m.done, 0);
                                const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                                const isFinished = p.finishDate;
                                const barColor = getProgressColor(percent);
                                const borderColor = getBorderColor(percent);

                                return (
                                    <div className={`card mb-6 border-2 ${isFinished ? 'bg-zinc-800/80' : ''} ${borderColor}`}>
                                        <div className="text-center font-bold text-white text-xl mb-5 leading-tight">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>

                                        <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                                            <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center">
                                                <span>{p.startDate}</span>
                                            </div>
                                            <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>
                                                {isFinished ? (p.endDate || p.finishDate) : 'В работе'}
                                            </div>
                                            <div className="flex justify-center">
                                                {p.driveLink ? <a href={p.driveLink} target="_blank" className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}
                                            </div>
                                        </div>

                                        <div className="w-full bg-zinc-900 rounded-full h-6 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                                            <div className={`progress-bar h-6 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                            <span className="absolute inset-0 flex items-center justify-center text-sm font-bold text-white text-shadow-sm">{percent}%</span>
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* Список материалов */}
                            <div className="space-y-4">
                                {(() => {
                                    const proj = projects.find(p => p.id === selectedProjectId);
                                    if (!proj || !proj.materials) return null;

                                    const sortedMaterials = [...proj.materials].sort((a, b) => {
                                        const aFinished = a.done === a.total;
                                        const bFinished = b.done === b.total;
                                        if (aFinished && !bFinished) return 1;
                                        if (!aFinished && bFinished) return -1;
                                        return 0;
                                    });

                                    return sortedMaterials.map(mat => {
                                        const percent = mat.total === 0 ? 0 : Math.round((mat.done / mat.total) * 100);
                                        const barColor = getProgressColor(percent);
                                        return (
                                            <div key={mat.id} className="card">
                                                <div className="text-sm text-zinc-200 font-medium mb-3">{mat.name}</div>
                                                <div className="flex items-center justify-between mb-3">
                                                    <div className="text-2xl font-bold text-white tracking-wide">{mat.done} / {mat.total}</div>
                                                    <div className="flex space-x-2">
                                                        <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, -1)} className="btn-icon w-12 h-10"><Icons.Minus /></button>
                                                        <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, 1)} className={`w-14 h-10 rounded-lg flex items-center justify-center active:scale-95 transition-all shadow-lg ${percent === 100 ? 'bg-zinc-700 opacity-50 text-white' : 'btn-blue !p-0'}`}>{percent === 100 ? <Icons.Check /> : <Icons.Plus />}</button>
                                                    </div>
                                                </div>
                                                <div className="w-full bg-zinc-900 rounded-full h-4 relative overflow-hidden mt-1 shadow-inner">
                                                    <div className={`progress-bar h-4 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                    <span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white text-shadow-sm">{percent}%</span>
                                                </div>
                                            </div>
                                        );
                                    });
                                })()}
                            </div>
                        </div>
                    ) : (
                        <>
                            {activeTab === 'projects' && (
                                <div className="p-4 pb-24">
                                    <div className="flex justify-center mb-6 mt-2">
                                        <button
                                            onClick={() => setFilterStatus(filterStatus === 'active' ? 'all' : 'active')}
                                            className="text-title"
                                            title="Нажмите, чтобы переключить фильтр проектов">
                                            {filterStatus === 'active' ? 'Текущие проекты' : 'Все проекты'}
                                        </button>
                                    </div>

                                    <div className="mb-6 flex space-x-3 items-center">
                                        {/* Строка поиска */}
                                        <div className="relative flex-1">
                                            <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-zinc-500">
                                                <Icons.Search />
                                            </div>
                                            <input
                                                type="text"
                                                className="input-field pl-10"
                                                placeholder="Поиск..."
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                            />
                                        </div>

                                        <button
                                            onClick={() => setIsCreatingProject(true)}
                                            className="btn-blue w-12 h-12 shrink-0 !p-0 flex items-center justify-center"
                                            title="Добавить проект"
                                        >
                                            <Icons.Plus />
                                        </button>
                                    </div>
                                    {filteredAndSortedProjects.length === 0 && (
                                        <div className="text-center text-zinc-500 mt-10 p-8 border border-dashed border-zinc-700 rounded-xl bg-zinc-800/50">
                                            {searchQuery || filterStatus !== 'all' ? "Ничего не найдено" : "Нажмите на кнопку с плюсом, чтобы создать проект"}
                                        </div>
                                    )}

                                    <div className="space-y-4">
                                        {filteredAndSortedProjects.map(p => {
                                            const safeMats = p.materials || [];
                                            const totalMats = safeMats.reduce((acc, m) => acc + m.total, 0);
                                            const doneMats = safeMats.reduce((acc, m) => acc + m.done, 0);
                                            const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                                            const isFinished = p.finishDate;
                                            const barColor = getProgressColor(percent);
                                            const borderColor = getBorderColor(percent);

                                            return (
                                                <div key={p.id} onClick={() => setSelectedProjectId(p.id)} className={`card cursor-pointer border-2 active:scale-95 transition-transform ${isFinished ? 'opacity-75 bg-zinc-800/80' : ''} ${borderColor}`}>
                                                    <div className="text-center font-bold text-white text-lg mb-4 leading-tight">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>

                                                    <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                                                        <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center">
                                                            <span>{p.startDate}</span>
                                                        </div>
                                                        <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>
                                                            {isFinished ? (p.endDate || p.finishDate) : 'В работе'}
                                                        </div>
                                                        <div className="flex justify-center">
                                                            {p.driveLink ? <a href={p.driveLink} target="_blank" onClick={(e) => e.stopPropagation()} className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}
                                                        </div>
                                                    </div>

                                                    <div className="w-full bg-zinc-900 rounded-full h-5 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                                                        <div className={`progress-bar h-5 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                                                        <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white text-shadow-sm">{percent}%</span>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}
                            {activeTab === 'warehouse' && (
                                <UnifiedWarehouseView warehouse={warehouse} tools={tools} onAdd={handleAddInventory} onUpdateQty={handleUpdateInventoryQty} onDelete={handleDeleteInventory} onBulkImport={handleBulkImport} />
                            )}
                            {activeTab === 'tool_log' && (
                                <ToolLogView tools={tools} toolLogs={toolLogs} onLogChange={handleLogToolChange} onDeleteLog={handleDeleteToolLog} onUpdateLog={handleUpdateToolLog} />
                            )}
                        </>
                    )}

                    {/* НАВИГАЦИЯ */}
                    <div className="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 flex justify-around pb-safe pt-2 px-1 z-50 max-w-md mx-auto shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                        <button onClick={() => { setActiveTab('projects'); setSelectedProjectId(null); setIsCreatingProject(false); setEditingProject(null); }} className={`nav-item ${activeTab === 'projects' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Projects />
                            <span>Проекты</span>
                        </button>
                        <button onClick={() => { setActiveTab('tool_log'); setSelectedProjectId(null); setIsCreatingProject(false); setEditingProject(null); }} className={`nav-item ${activeTab === 'tool_log' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Service />
                            <span>Сервис</span>
                        </button>
                        <button onClick={() => { setActiveTab('warehouse'); setSelectedProjectId(null); setIsCreatingProject(false); setEditingProject(null); }} className={`nav-item ${activeTab === 'warehouse' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Warehouse />
                            <span>Склад</span>
                        </button>
                        <button onClick={() => { setActiveTab('setting'); setSelectedProjectId(null); setIsCreatingProject(false); setEditingProject(null); }} className={`nav-item ${activeTab === 'setting' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                            <Icons.Setting />
                            <span>Настройки</span>
                        </button>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=2')
                    .then(registration => {
                        console.log('Service Worker успешно зарегистрирован!');
                    })
                    .catch(err => {
                        console.log('Ошибка регистрации Service Worker:', err);
                    });
            });
        }
    </script>
</body>

    
</html>
