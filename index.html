<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Manager - Local Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icons = {
            Home: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Tool: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
            Warehouse: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Minus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        };

        const initialProjects = [
          {
            id: "1", name: "Gross Siemens", startDate: "6.05.2026",
            materials: [
              { id: 101, name: "MDF G Yazuk 22mm", total: 6, done: 0 },
              { id: 102, name: "Birch 16mm FrmGraf", total: 34, done: 0 }
            ]
          }
        ];

        function App() {
          const [activeTab, setActiveTab] = useState('projects');
          const [selectedProjectId, setSelectedProjectId] = useState(null);
          
          // Загрузка данных из памяти браузера при старте
          const [projects, setProjects] = useState(() => {
            const saved = localStorage.getItem('cnc_projects');
            return saved ? JSON.parse(saved) : initialProjects;
          });
          
          const [toolsLog, setToolsLog] = useState(() => {
            const saved = localStorage.getItem('cnc_tools');
            return saved ? JSON.parse(saved) : [];
          });

          // Сохранение в память при каждом изменении
          useEffect(() => {
            localStorage.setItem('cnc_projects', JSON.stringify(projects));
          }, [projects]);

          useEffect(() => {
            localStorage.setItem('cnc_tools', JSON.stringify(toolsLog));
          }, [toolsLog]);

          const handleUpdateMaterial = (projectId, materialId, newDoneValue) => {
            setProjects(projects.map(proj => {
              if (proj.id === projectId) {
                return {
                  ...proj,
                  materials: proj.materials.map(mat => {
                    if (mat.id === materialId) {
                      return { ...mat, done: Math.max(0, Math.min(newDoneValue, mat.total)) };
                    }
                    return mat;
                  })
                };
              }
              return proj;
            }));
          };

          const handleAddToolLog = () => {
            const toolNum = window.prompt("Введите номер фрезы:", "");
            if (toolNum) {
              const now = new Date();
              const newLog = { 
                id: Date.now(), 
                date: now.toLocaleDateString('ru-RU'), 
                time: now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}), 
                tool: toolNum 
              };
              setToolsLog([newLog, ...toolsLog]);
            }
          };

          const handleResetData = () => {
             if(window.confirm("Удалить все данные и загрузить изначальные?")) {
                 setProjects(initialProjects);
                 setToolsLog([]);
             }
          }

          const renderProgressBar = (materials) => {
            const totalSheets = materials.reduce((acc, mat) => acc + mat.total, 0);
            const doneSheets = materials.reduce((acc, mat) => acc + mat.done, 0);
            const percent = totalSheets === 0 ? 0 : Math.round((doneSheets / totalSheets) * 100);

            return (
              <div className="w-full mt-3">
                <div className="flex justify-between text-xs text-gray-400 mb-1">
                  <span>Готово: {doneSheets} из {totalSheets}</span>
                  <span className="font-bold text-blue-400">{percent}%</span>
                </div>
                <div className="w-full bg-slate-700 rounded-full h-2.5">
                  <div className="bg-blue-500 h-2.5 rounded-full" style={{ width: `${percent}%` }}></div>
                </div>
              </div>
            );
          };

          const ProjectListView = () => (
            <div className="p-4 pb-24 space-y-4">
              <div className="flex justify-between items-center mb-6">
                 <h1 className="text-2xl font-bold text-white">Проекты в работе</h1>
                 <button onClick={handleResetData} className="text-xs bg-red-900/50 text-red-300 px-2 py-1 rounded">Сброс</button>
              </div>
              
              {projects.map(proj => (
                <div key={proj.id} onClick={() => setSelectedProjectId(proj.id)} className="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 cursor-pointer">
                  <div className="flex justify-between items-start">
                    <h2 className="text-lg font-semibold text-white">{proj.name}</h2>
                    <span className="bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded">с {proj.startDate}</span>
                  </div>
                  {renderProgressBar(proj.materials)}
                </div>
              ))}
            </div>
          );

          const ProjectDetailView = () => {
            const project = projects.find(p => p.id === selectedProjectId);
            return (
              <div className="p-4 pb-24">
                <button onClick={() => setSelectedProjectId(null)} className="flex items-center text-blue-400 mb-4 p-2 -ml-2 rounded-lg">
                  <Icons.ArrowLeft /> <span className="ml-2 font-medium">Назад</span>
                </button>
                <h1 className="text-2xl font-bold text-white mb-2">{project.name}</h1>
                <div className="mb-6">{renderProgressBar(project.materials)}</div>
                <div className="space-y-3">
                  {project.materials.map(mat => {
                    const isComplete = mat.done === mat.total;
                    return (
                      <div key={mat.id} className={`p-4 rounded-xl border ${isComplete ? 'bg-green-900/20 border-green-800/50' : 'bg-slate-800 border-slate-700'}`}>
                        <div className="text-sm text-slate-300 mb-3">{mat.name}</div>
                        <div className="flex items-center justify-between">
                          <div className="text-2xl font-bold text-white w-16 text-center">{mat.done} <span className="text-lg text-slate-500">/ {mat.total}</span></div>
                          <div className="flex space-x-2">
                            <button onClick={() => handleUpdateMaterial(project.id, mat.id, mat.done - 1)} className="w-12 h-12 bg-slate-700 rounded-xl flex justify-center items-center text-white"><Icons.Minus /></button>
                            <button onClick={() => handleUpdateMaterial(project.id, mat.id, mat.done + 1)} className={`w-16 h-12 rounded-xl flex justify-center items-center text-white ${isComplete ? 'bg-slate-700' : 'bg-blue-600'}`}>{isComplete ? <Icons.Check /> : <Icons.Plus />}</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          };

          const ToolLogView = () => (
            <div className="p-4 pb-24">
              <h1 className="text-2xl font-bold text-white mb-6">Журнал инструмента</h1>
              <button onClick={handleAddToolLog} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl mb-6 flex justify-center items-center">
                <Icons.Plus /> <span className="ml-2">Зафиксировать замену</span>
              </button>
              <div className="bg-slate-800 rounded-xl overflow-hidden">
                <table className="w-full text-left text-slate-300">
                  <thead className="bg-slate-900/50 text-xs uppercase text-slate-500">
                    <tr><th className="px-4 py-3">Дата</th><th className="px-4 py-3">Время</th><th className="px-4 py-3">Фреза</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-700/50">
                    {toolsLog.map((log) => (
                      <tr key={log.id}><td className="px-4 py-3">{log.date}</td><td className="px-4 py-3">{log.time}</td><td className="px-4 py-3 font-bold text-white">#{log.tool}</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );

          return (
            <div className="max-w-md mx-auto relative h-full min-h-screen bg-slate-900 shadow-2xl">
              {selectedProjectId ? <ProjectDetailView /> : (
                <>
                  {activeTab === 'projects' && <ProjectListView />}
                  {activeTab === 'tools' && <ToolLogView />}
                </>
              )}
              {!selectedProjectId && (
                <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 flex justify-around pb-safe pt-2 px-2 z-50 max-w-md mx-auto">
                  <button onClick={() => setActiveTab('projects')} className={`flex flex-col items-center p-2 min-w-[80px] ${activeTab === 'projects' ? 'text-blue-500' : 'text-slate-500'}`}><Icons.Home /><span className="text-[10px] mt-1">Проекты</span></button>
                  <button onClick={() => setActiveTab('tools')} className={`flex flex-col items-center p-2 min-w-[80px] ${activeTab === 'tools' ? 'text-blue-500' : 'text-slate-500'}`}><Icons.Tool /><span className="text-[10px] mt-1">Инструмент</span></button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
