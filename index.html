    const ProjectFormView = ({ projectToEdit, onSave, onCancel, warehouse }) => {
      const [customer, setCustomer] = useState(projectToEdit ? (projectToEdit.customer || '') : '');
      const [name, setName] = useState(projectToEdit ? projectToEdit.name : '');
      const [startDate, setStartDate] = useState(projectToEdit ? projectToEdit.startDate : new Date().toLocaleDateString('ru-RU'));
      const [endDate, setEndDate] = useState(projectToEdit ? (projectToEdit.endDate || projectToEdit.finishDate || '') : '');
      const [driveLink, setDriveLink] = useState(projectToEdit ? (projectToEdit.driveLink || '') : '');
      const [mats, setMats] = useState(projectToEdit && projectToEdit.materials && projectToEdit.materials.length > 0
        ? projectToEdit.materials
        : [{ id: Date.now(), name: '', total: 1, done: 0 }]);

      const [isImportMode, setIsImportMode] = useState(false);
      const [importText, setImportText] = useState("");

      const addRow = () => setMats([...mats, { id: Date.now(), name: '', total: 1, done: 0 }]);
      const upd = (id, f, v) => setMats(mats.map(m => m.id === id ? { ...m, [f]: v } : m));
      const rm = (id) => setMats(mats.filter(m => m.id !== id));

      // --- ОБНОВЛЕННЫЙ ПАРСЕР, ЧИТАЮЩИЙ ОБРЫВКИ PDF ---
      const handleParseImport = () => {
          if (!importText.trim()) {
              setIsImportMode(false);
              return;
          }

          let linesRaw = importText.replace(/\r\n/g, '\n').split('\n');
          let parsedMats = [];
          let currentNameBuffer = [];
          let expectingData = false;

          for (let i = 0; i < linesRaw.length; i++) {
              let line = linesRaw[i].trim();
              if (!line) continue;

              // Очистка от кавычек
              let cleanLine = line.replace(/"/g, '').trim();
              
              // Вырезаем "Has Grain..." и всё, что за ним, так как они могут приклеиться к названию
              cleanLine = cleanLine.replace(/has grain.*$/i, '').trim();
              // Вырезаем цены (₪ 0.00, ₪ #####)
              cleanLine = cleanLine.replace(/₪\s*[\d,.]+/g, '').replace(/₪\s*#+/g, '').replace(/₪/g, '').trim();
              
              if (!cleanLine) continue;
              
              // Пропускаем системный мусор
              const lower = cleanLine.toLowerCase();
              if (lower.includes('material summary') || lower.includes('job:') || lower.includes('description') || /^page \d/.test(lower)) continue;
              if (/^\d{2}\/\d{2}\/\d{4}/.test(cleanLine)) continue; // Даты
              
              // Пропускаем заголовки таблиц
              if (/^(qty|width|length|thick|cost|\s|,)*$/i.test(cleanLine)) continue;
              if (/^qty\s+width/i.test(cleanLine)) continue;

              // 1. Ищем строку с данными: "2 mm 1,220.00 2,750.00..."
              const dataMatch = cleanLine.match(/^(\d+)\s*(?:mm\s*)?([\d,.]+)(?:\s*mm)?\s+(?:x\s*|\*\s*)?([\d,.]+)(?:\s*mm)?/i);
              
              if (dataMatch) {
                  let qty = parseInt(dataMatch[1], 10);
                  // Очищаем размеры от запятых и отсекаем десятичные знаки (всё что после точки)
                  let width = dataMatch[2].replace(/,/g, '').split('.')[0];
                  let length = dataMatch[3].replace(/,/g, '').split('.')[0];
                  
                  let fullName = currentNameBuffer.join(' ').trim();
                  if (fullName) {
                      let finalName = `${fullName} (${width}x${length})`;
                      parsedMats.push({ name: finalName, total: qty, done: 0 });
                  }
                  expectingData = true; // Ждем следующее название после данных
                  continue;
              }

              // 2. Иначе это кусок названия материала (накапливаем его)
              if (expectingData) {
                  // Если мы уже добавили данные и встретили новый текст - это новый материал
                  currentNameBuffer = [cleanLine];
                  expectingData = false;
              } else {
                  // Иначе просто дописываем кусок названия
                  currentNameBuffer.push(cleanLine);
              }
          }

          // --- ФОЛЛБЕК НА ОБЫЧНЫЙ ТЕКСТ (Если это не PDF таблица) ---
          if (parsedMats.length === 0) {
               linesRaw.forEach(line => {
                   let cleanLine = line.replace(/"/g, '').trim();
                   if(!cleanLine) return;
                   let m = cleanLine.match(/^(.*?)\s+(\d+)\s*(?:шт\.?|pcs\.?)?$/i);
                   if (m && m[1].length > 2) {
                       parsedMats.push({ name: m[1].trim(), total: parseInt(m[2]), done: 0 });
                   } else {
                       parsedMats.push({ name: cleanLine, total: 1, done: 0 });
                   }
               });
          }

          // --- ГРУППИРОВКА ОДИНАКОВЫХ МАТЕРИАЛОВ ---
          const grouped = [];
          parsedMats.forEach(pm => {
              let clean = pm.name.replace(/\s+/g, ' ').replace(/^:\s*/, '').trim(); 
              const existing = grouped.find(g => g.name === clean);
              if (existing) {
                  existing.total += pm.total; // Суммируем количество
              } else if (clean) {
                  grouped.push({ id: Date.now() + Math.random(), name: clean, total: pm.total, done: 0 });
              }
          });

          if (grouped.length > 0) {
               if (mats.length === 1 && !mats[0].name) {
                   setMats(grouped);
               } else {
                   setMats([...mats, ...grouped]);
               }
               setImportText('');
               setIsImportMode(false);
          } else {
               alert("Не удалось распознать материалы. Убедитесь, что скопировали кусок с названиями и количеством (Qty).");
          }
      };

      return (
        <div className="p-4 pb-24">
          <button onClick={onCancel} className="text-blue-400 mb-4 flex items-center -ml-2 p-2 hover:text-blue-300"><Icons.ArrowLeft /> Назад</button>
          <h1 className="text-2xl font-bold text-white mb-6">{projectToEdit ? "Редактирование" : "Создать проект"}</h1>

          <div className="space-y-4 mb-8">
            <div>
              <label className="label-text">Заказчик (Клиент):</label>
              <input className="input-field" placeholder="Имя заказчика или номер договора" value={customer} onChange={e => setCustomer(e.target.value)} />
            </div>

            <div>
              <label className="label-text">Название проекта:</label>
              <input className="input-field" placeholder="Например: Кухня 1" value={name} onChange={e => setName(e.target.value)} />
            </div>

            <div>
              <label className="label-text">Даты проекта:</label>
              <div className="flex space-x-2">
                <input className="input-field flex-1" placeholder="Начало (ДД.ММ.ГГГГ)" value={startDate} onChange={e => setStartDate(e.target.value)} />
                <input className="input-field flex-1" placeholder="Окончание (План)" value={endDate} onChange={e => setEndDate(e.target.value)} />
              </div>
            </div>

            <div>
              <label className="label-text">Ссылка на Google Drive (Чертежи):</label>
              <input className="input-field" placeholder="https://drive.google.com/..." value={driveLink} onChange={e => setDriveLink(e.target.value)} />
            </div>

            <div className="card mt-6 relative">
              <div className="flex justify-between items-center mb-4">
                  <label className="label-text !mb-0">План резки (Материалы)</label>
                  {!isImportMode && (
                      <button onClick={() => setIsImportMode(true)} className="text-[10px] uppercase font-bold bg-blue-600/20 text-blue-400 px-3 py-1.5 rounded-lg hover:bg-blue-600/40 transition-colors">
                          ⚡ Быстрый импорт
                      </button>
                  )}
              </div>

              {isImportMode ? (
                  <div className="mb-4 bg-zinc-900 p-3 rounded-xl border border-zinc-700/50">
                      <div className="text-xs text-zinc-400 mb-2">
                          Вставьте скопированный текст из PDF. Умный алгоритм почистит мусор, найдет названия и правильно склеит количество.
                      </div>
                      <textarea 
                          className="input-field h-32 mb-3 text-xs font-mono leading-tight" 
                          placeholder="Вставляйте прямо как скопировалось из PDF..." 
                          value={importText} 
                          onChange={e => setImportText(e.target.value)} 
                      />
                      <div className="flex space-x-2">
                          <button onClick={() => setIsImportMode(false)} className="flex-1 bg-zinc-700 text-white font-bold p-2 rounded-lg text-sm">Отмена</button>
                          <button onClick={handleParseImport} className="flex-1 bg-blue-600 text-white font-bold p-2 rounded-lg text-sm">Распознать</button>
                      </div>
                  </div>
              ) : (
                  <>
                      {mats.map(m => (
                        <div key={m.id} className="flex space-x-2 mb-3 items-center">
                          <input list="warehouse-suggestions" className="input-sm flex-1" placeholder="Материал" value={m.name} onChange={e => upd(m.id, 'name', e.target.value)} />
                          <input type="number" min="1" className="input-sm w-16 text-center" value={m.total} onChange={e => upd(m.id, 'total', e.target.value)} />
                          <button onClick={() => rm(m.id)} className="btn-icon !p-2 hover:!text-red-400"><Icons.Trash /></button>
                        </div>
                      ))}
                      <button onClick={addRow} className="text-sm text-blue-400 font-medium mt-3 flex items-center p-2 -ml-2 rounded-lg hover:bg-zinc-700 transition-colors"><Icons.Plus /> Добавить вручную</button>
                  </>
              )}
            </div>
          </div>
          <button onClick={() => onSave(customer, name, mats, projectToEdit ? projectToEdit.id : null, startDate, endDate, driveLink)} disabled={!name.trim()} className="btn-primary">
            {projectToEdit ? "Сохранить изменения" : "Запустить проект"}
          </button>
        </div>
      );
    };

    // --- ГЛАВНЫЙ КОМПОНЕНТ APP --- //

    function App() {
      const [user, setUser] = useState(null);
      const [isAuthLoading, setIsAuthLoading] = useState(true);
      const [authError, setAuthError] = useState("");

      const [activeTab, setActiveTab] = useState('projects');

      const [projects, setProjects] = useState([]);
      const [warehouse, setWarehouse] = useState([]);
      const [tools, setTools] = useState([]);
      const [toolLogs, setToolLogs] = useState([]);

      const [selectedProjectId, setSelectedProjectId] = useState(null);
      const [isCreatingProject, setIsCreatingProject] = useState(false);
      const [editingProject, setEditingProject] = useState(null);

      const [searchQuery, setSearchQuery] = useState("");
      const [filterStatus, setFilterStatus] = useState("all");

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (error) {
            console.error("Auth error:", error);
            setAuthError("Ошибка авторизации. Проверьте настройки Firebase.");
            setIsAuthLoading(false);
          }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) { setUser(currentUser); setAuthError(""); }
          setIsAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const getCol = (name) => collection(db, 'artifacts', appId, 'public', 'data', name);
        const unsubProjects = onSnapshot(getCol('projects'), (snap) => setProjects(snap.docs.map(d => ({ id: d.id, ...d.data() }))), console.error);
        const unsubWarehouse = onSnapshot(getCol('warehouse'), (snap) => setWarehouse(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
        const unsubTools = onSnapshot(getCol('tools'), (snap) => setTools(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name))), console.error);
        const unsubToolLogs = onSnapshot(getCol('toolLogs'), (snap) => setToolLogs(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.timestamp - a.timestamp)), console.error);
        return () => { unsubProjects(); unsubWarehouse(); unsubTools(); unsubToolLogs(); };
      }, [user]);

      const filteredAndSortedProjects = useMemo(() => {
        let sorted = [...projects].sort((a, b) => {
          if (a.finishDate && !b.finishDate) return 1;
          if (!a.finishDate && b.finishDate) return -1;
          return (b.timestamp || 0) - (a.timestamp || 0);
        });

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          sorted = sorted.filter(p =>
            (p.name && p.name.toLowerCase().includes(q)) ||
            (p.customer && p.customer.toLowerCase().includes(q))
          );
        }

        if (filterStatus === 'active') {
          sorted = sorted.filter(p => !p.finishDate);
        }

        return sorted;
      }, [projects, searchQuery, filterStatus]);

      const handleLogToolChange = async (toolId, machineName, typeCategory) => {
        if (!user) return;
        try {
            const now = new Date();
            const payload = {
                machine: machineName, date: now.toLocaleDateString('ru-RU'), time: now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}), timestamp: now.getTime(), type: typeCategory || 'knives' 
            };
            if (typeCategory === 'knives' && toolId) {
                const toolItem = tools.find(t => t.id === toolId);
                if (toolItem) {
                    payload.toolId = toolItem.id; payload.toolName = toolItem.name;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tools', toolItem.id), { quantity: toolItem.quantity - 1 });
                }
            }
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'toolLogs'), payload);
        } catch (err) { alert("Ошибка фиксации."); }
      };

      const handleUpdateToolLog = async (logId, toolId, machine, date, time) => {
        if (!user) return;
        const payload = { machine, date, time };
        if (toolId) {
            const toolItem = tools.find(t => t.id === toolId);
            if (toolItem) { payload.toolId = toolItem.id; payload.toolName = toolItem.name; }
        }
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', logId), payload);
      };

      const handleDeleteToolLog = async (id) => {
        if (window.confirm("Удалить эту запись из истории?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'toolLogs', id));
      };

      const handleUpdateMaterial = async (projectId, materialId, delta) => {
        if (!user) return;
        const project = projects.find(p => p.id === projectId);
        if (!project || !project.materials) return;
        const matIndex = project.materials.findIndex(m => m.id === materialId);
        if (matIndex === -1) return;

        const mat = project.materials[matIndex];
        const newDone = mat.done + delta;
        if (newDone < 0 || newDone > mat.total) return;

        try {
          const updatedMaterials = [...project.materials];
          updatedMaterials[matIndex].done = newDone;
          const isFinished = updatedMaterials.every(m => m.done === m.total);
          
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', projectId), {
            materials: updatedMaterials, finishDate: isFinished ? new Date().toLocaleDateString('ru-RU') : null
          });

          const warehouseItem = warehouse.find(w => w.name === mat.name);
          if (warehouseItem) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'warehouse', warehouseItem.id), { quantity: warehouseItem.quantity - delta });
        } catch (err) { console.error("Ошибка обновления:", err); }
      };

      const handleSaveProject = async (customerStr, nameStr, mats, editingId = null, startDateStr, endDateStr, driveLinkStr) => {
        if (!user || !nameStr.trim()) return;
        const payload = {
          customer: customerStr.trim(), name: nameStr.trim(), 
          driveLink: driveLinkStr ? driveLinkStr.trim() : '',
          endDate: endDateStr ? endDateStr.trim() : '',
          materials: mats.filter(m => m.name.trim() !== '').map((m, i) => ({ id: m.id || Date.now() + i, name: m.name, total: Number(m.total), done: m.done || 0 }))
        };

        const isFinished = payload.materials.length > 0 && payload.materials.every(m => m.done === m.total);
        payload.finishDate = isFinished ? new Date().toLocaleDateString('ru-RU') : null;

        if (editingId) {
          payload.startDate = startDateStr;
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'projects', editingId), payload);
        } else {
          payload.startDate = startDateStr || new Date().toLocaleDateString('ru-RU');
          payload.timestamp = Date.now();
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'projects'), payload);
        }
        setIsCreatingProject(false); setEditingProject(null);
      };

      const handleAddInventory = async (itemData, collectionName) => {
        if (!user || !itemData.name.trim()) return;
        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
          ...itemData, timestamp: Date.now()
        });
      };

      const handleUpdateInventoryQty = async (id, currentQty, delta, collectionName) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id), { quantity: currentQty + delta });
      };

      const handleDeleteInventory = async (id, collectionName) => {
        if (window.confirm("Удалить позицию со склада навсегда?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', collectionName, id));
      };

      const handleBulkImport = async (text, collectionName) => {
        if (!user || !text.trim()) return;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        for (const line of lines) {
          const currentItems = collectionName === 'warehouse' ? warehouse : tools;
          if (!currentItems.find(i => i.name.toLowerCase() === line.toLowerCase())) {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', collectionName), {
              name: line, quantity: 0, timestamp: Date.now()
            });
          }
        }
      };

      if (isAuthLoading) return <div className="min-h-screen bg-zinc-900 flex items-center justify-center text-zinc-400">Подключение...</div>;
      if (authError) return <div className="min-h-screen bg-zinc-900 flex items-center justify-center p-6 text-center text-red-400 font-bold">{authError}</div>;

      return (
        <div className="max-w-md mx-auto relative h-full min-h-screen bg-zinc-900 shadow-2xl">
          <datalist id="warehouse-suggestions">
            {warehouse.map(w => <option key={w.id} value={w.name} />)}
          </datalist>

          {/* РОУТИНГ */}
          {isCreatingProject || editingProject ? (
            <ProjectFormView projectToEdit={editingProject} onSave={handleSaveProject} onCancel={() => { setIsCreatingProject(false); setEditingProject(null); }} warehouse={warehouse} />
          ) : selectedProjectId ? (
            <div className="p-4 pb-24">
              <div className="flex justify-between items-center mb-6">
                <button onClick={() => setSelectedProjectId(null)} className="text-blue-400 flex items-center -ml-2 p-2 rounded-lg hover:text-blue-300 transition-colors"><Icons.ArrowLeft /> Назад</button>
                <button onClick={() => { setEditingProject(projects.find(p => p.id === selectedProjectId)); setIsCreatingProject(true); }} className="btn-icon w-10 h-10 shadow"><Icons.Edit /></button>
              </div>

              {/* Карточка проекта (Детальный вид) */}
              {(() => {
                const p = projects.find(pr => pr.id === selectedProjectId);
                if (!p) return null;
                const safeMaterials = p.materials || [];
                const totalMats = safeMaterials.reduce((acc, m) => acc + m.total, 0);
                const doneMats = safeMaterials.reduce((acc, m) => acc + m.done, 0);
                const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                const isFinished = p.finishDate;
                const barColor = getProgressColor(percent);
                const borderColor = getBorderColor(percent);

                return (
                  <div className={`card mb-6 border-2 ${isFinished ? 'bg-zinc-800/80' : ''} ${borderColor}`}>
                    <div className="text-center font-bold text-white text-xl mb-5 leading-tight">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>

                    <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                      <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center">
                          <span>{p.startDate}</span>
                      </div>
                      <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>
                          {isFinished ? (p.endDate || p.finishDate) : 'В работе'}
                      </div>
                      <div className="flex justify-center">
                        {p.driveLink ? <a href={p.driveLink} target="_blank" className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}
                      </div>
                    </div>

                    <div className="w-full bg-zinc-900 rounded-full h-6 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                      <div className={`progress-bar h-6 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                      <span className="absolute inset-0 flex items-center justify-center text-sm font-bold text-white text-shadow-sm">{percent}%</span>
                    </div>
                  </div>
                );
              })()}

              {/* Список материалов */}
              <div className="space-y-4">
                {(() => {
                  const proj = projects.find(p => p.id === selectedProjectId);
                  if (!proj || !proj.materials) return null;
                  
                  const sortedMaterials = [...proj.materials].sort((a, b) => {
                    const aFinished = a.done === a.total;
                    const bFinished = b.done === b.total;
                    if (aFinished && !bFinished) return 1;
                    if (!aFinished && bFinished) return -1;
                    return 0;
                  });

                  return sortedMaterials.map(mat => {
                    const percent = mat.total === 0 ? 0 : Math.round((mat.done / mat.total) * 100);
                    const barColor = getProgressColor(percent);
                    return (
                      <div key={mat.id} className="card">
                        <div className="text-sm text-zinc-200 font-medium mb-3">{mat.name}</div>
                        <div className="flex items-center justify-between mb-3">
                          <div className="text-2xl font-bold text-white tracking-wide">{mat.done} / {mat.total}</div>
                          <div className="flex space-x-2">
                            <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, -1)} className="btn-icon w-12 h-10"><Icons.Minus /></button>
                            <button onClick={() => handleUpdateMaterial(selectedProjectId, mat.id, 1)} className={`w-14 h-10 rounded-lg flex items-center justify-center active:scale-95 transition-all shadow-lg ${percent === 100 ? 'bg-zinc-700 opacity-50 text-white' : 'btn-blue !p-0'}`}>{percent === 100 ? <Icons.Check /> : <Icons.Plus />}</button>
                          </div>
                        </div>
                        <div className="w-full bg-zinc-900 rounded-full h-4 relative overflow-hidden mt-1 shadow-inner">
                          <div className={`progress-bar h-4 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                          <span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white text-shadow-sm">{percent}%</span>
                        </div>
                      </div>
                    );
                  });
                })()}
              </div>
            </div>
          ) : (
            <>
              {activeTab === 'projects' && (
                <div className="p-4 pb-24">
                  <div className="flex justify-center mb-6 mt-2">
                    <button onClick={() => setIsCreatingProject(true)} className="text-3xl font-bold text-white hover:text-blue-400 transition-colors tracking-widest outline-none active:scale-95 uppercase">
                      {filterStatus === 'active' ? 'Текущие проекты' : 'Все проекты'}
                    </button>
                  </div>

                  <div className="mb-6 flex space-x-3 items-center">
                    {/* Строка поиска */}
                    <div className="relative flex-1">
                      <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none text-zinc-500">
                        <Icons.Search />
                      </div>
                      <input
                        type="text"
                        className="input-field pl-10"
                        placeholder="Поиск..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                      />
                    </div>
                    
                    {/* КРАСИВЫЙ CHECKBOX TOGGLE БЕЗ ТЕКСТА */}
                    <label className="flex items-center cursor-pointer shrink-0 group" title={filterStatus === 'active' ? 'Показать все' : 'Только текущие'}>
                        <div className="relative">
                            <input 
                                type="checkbox" 
                                className="sr-only toggle-checkbox" 
                                checked={filterStatus === 'active'} 
                                onChange={(e) => setFilterStatus(e.target.checked ? 'active' : 'all')} 
                            />
                            <div className="toggle-label block w-11 h-6 bg-zinc-700 rounded-full border border-zinc-600 transition-colors"></div>
                            <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${filterStatus === 'active' ? 'transform translate-x-5' : ''}`}></div>
                        </div>
                    </label>
                  </div>

                  {filteredAndSortedProjects.length === 0 && (
                    <div className="text-center text-zinc-500 mt-10 p-8 border border-dashed border-zinc-700 rounded-xl bg-zinc-800/50">
                      {searchQuery || filterStatus !== 'all' ? "Ничего не найдено" : "Нажмите на слово ПРОЕКТЫ, чтобы создать"}
                    </div>
                  )}

                  <div className="space-y-4">
                    {filteredAndSortedProjects.map(p => {
                      const safeMats = p.materials || [];
                      const totalMats = safeMats.reduce((acc, m) => acc + m.total, 0);
                      const doneMats = safeMats.reduce((acc, m) => acc + m.done, 0);
                      const percent = totalMats === 0 ? 0 : Math.round((doneMats / totalMats) * 100);
                      const isFinished = p.finishDate;
                      const barColor = getProgressColor(percent);
                      const borderColor = getBorderColor(percent);

                      return (
                        <div key={p.id} onClick={() => setSelectedProjectId(p.id)} className={`card cursor-pointer border-2 active:scale-95 transition-transform ${isFinished ? 'opacity-75 bg-zinc-800/80' : ''} ${borderColor}`}>
                          <div className="text-center font-bold text-white text-lg mb-4 leading-tight">{p.customer ? `${p.customer} — ` : ''}{p.name}</div>

                          <div className="grid grid-cols-3 gap-2 text-center mb-4 border-t border-b border-zinc-700/50 py-3 items-center">
                            <div className="text-xs font-bold text-zinc-300 border-r border-zinc-700/50 flex flex-col justify-center">
                                <span>{p.startDate}</span>
                            </div>
                            <div className={`text-sm font-bold border-r border-zinc-700/50 ${isFinished ? 'text-green-400' : 'text-orange-400'}`}>
                                {isFinished ? (p.endDate || p.finishDate) : 'В работе'}
                            </div>
                            <div className="flex justify-center">
                              {p.driveLink ? <a href={p.driveLink} target="_blank" onClick={(e) => e.stopPropagation()} className="text-blue-400 hover:text-blue-300"><Icons.GoogleDrive /></a> : <span className="text-zinc-600"><Icons.GoogleDrive /></span>}
                            </div>
                          </div>

                          <div className="w-full bg-zinc-900 rounded-full h-5 relative overflow-hidden border border-zinc-700/50 shadow-inner mt-2">
                            <div className={`progress-bar h-5 rounded-full ${barColor}`} style={{ width: `${percent}%` }}></div>
                            <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-white text-shadow-sm">{percent}%</span>
                          </div>
                        </div>
                      )
                    })}
                  </div>
                </div>
              )}

              {activeTab === 'warehouse' && (
                <UnifiedWarehouseView warehouse={warehouse} tools={tools} onAdd={handleAddInventory} onUpdateQty={handleUpdateInventoryQty} onDelete={handleDeleteInventory} onBulkImport={handleBulkImport} />
              )}
              {activeTab === 'tool_log' && (
                <ToolLogView tools={tools} toolLogs={toolLogs} onLogChange={handleLogToolChange} onDeleteLog={handleDeleteToolLog} onUpdateLog={handleUpdateToolLog} />
              )}
            </>
          )}

          {/* НАВИГАЦИЯ */}
          {!selectedProjectId && !isCreatingProject && !editingProject && (
            <div className="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-md border-t border-zinc-800 flex justify-around pb-safe pt-2 px-1 z-50 max-w-md mx-auto shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
              <button onClick={() => setActiveTab('projects')} className={`nav-item ${activeTab === 'projects' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                <Icons.Projects />
                <span className="text-[13px] mt-1 font-bold">Проекты</span>
              </button>
              <button onClick={() => setActiveTab('tool_log')} className={`nav-item ${activeTab === 'tool_log' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                <Icons.Service />
                <span className="text-[13px] mt-1 font-bold">Обслуживание</span>
              </button>
              <button onClick={() => setActiveTab('warehouse')} className={`nav-item ${activeTab === 'warehouse' ? 'text-blue-500' : 'text-zinc-500 hover:text-zinc-300'}`}>
                <Icons.Warehouse />
                <span className="text-[10px] mt-1 font-bold">Склад</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
